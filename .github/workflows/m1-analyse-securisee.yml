# X1000 M1 - Analyse autonome securisee
# Version 1.3
#
# Depot : yadcaf-cloud/x1000-m1
#
# Lecture seule :
# - Aucun push GitHub
# - Aucun FIGE cree ou modifie
# - Aucune selection officielle modifiee
# - Aucun audit modifie
# - Aucun acces M2-M5
# - Aucune modification du tableau officiel
#
# Resultat :
# - Propositions heuristiques non validees
# - Rapport telechargeable depuis GitHub Actions
#
# Le workflow ne publie pas sur GitHub Pages.

name: "X1000 M1 - Analyse autonome securisee"

on:
  workflow_dispatch:

  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: read

concurrency:
  group: x1000-m1-analyse-securisee
  cancel-in-progress: false

jobs:
  analyse:
    name: "M1 - Analyse et prepublication"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:

      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les fichiers requis"
        run: |
          set -euo pipefail

          test -f m1.py
          test -f m1_analyse_autonome.py
          test -f data/collecte_m1_pmu.json

          python - <<'PY'
          from pathlib import Path

          for name in (
              "m1.py",
              "m1_analyse_autonome.py"
          ):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print(name, "syntaxe OK")
          PY

      - name: "Memoriser les empreintes protegees"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protected = [
              "m1.py",
              "pmu_engine.py",
              "index.html",
              "data/courses.json",
              "data/selections.json",
              "data/figes.json",
              "data/audits.json",
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          ]

          snapshot = {}

          for name in protected:
              path = Path(name)

              if path.is_file():
                  snapshot[name] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
              else:
                  snapshot[name] = None

          Path("/tmp/m1-snapshot.json").write_text(
              json.dumps(
                  snapshot,
                  indent=2,
                  sort_keys=True
              ),
              encoding="utf-8"
          )

          print("Empreintes SHA256 memorisees")
          PY

      - name: "Tester les moteurs M1"
        run: |
          set -euo pipefail

          python m1.py --self-test
          python m1.py --verify-archives
          python m1_analyse_autonome.py --self-test

      - name: "Verifier la collecte PMU"
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          path = Path("data/collecte_m1_pmu.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "Collecte : objet JSON attendu"
              )

          if data.get("statut") != "OK":
              raise SystemExit(
                  "Collecte non validee"
              )

          if data.get("erreurs") != []:
              raise SystemExit(
                  "Erreurs de collecte presentes"
              )

          courses = data.get("courses")

          if not isinstance(courses, list):
              raise SystemExit(
                  "courses : liste attendue"
              )

          paris = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(paris)

          if data.get("date") != now.date().isoformat():
              raise SystemExit(
                  "Collecte hors date Paris"
              )

          raw = data.get("collecte_a")

          if not isinstance(raw, str):
              raise SystemExit(
                  "Horodatage absent"
              )

          try:
              collected = dt.datetime.fromisoformat(
                  raw.replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(
                  "Horodatage invalide"
              )

          if (
              collected.tzinfo is None
              or collected.utcoffset() is None
          ):
              raise SystemExit(
                  "Fuseau horaire absent"
              )

          age = (
              now - collected.astimezone(paris)
          ).total_seconds()

          if not 0 <= age <= 1800:
              raise SystemExit(
                  "Collecte perimee ou future"
              )

          ids = set()

          for course in courses:

              if not isinstance(course, dict):
                  raise SystemExit(
                      "Course non structuree"
                  )

              cid = course.get("id")

              if not isinstance(cid, str):
                  raise SystemExit(
                      "Identifiant absent"
                  )

              if cid in ids:
                  raise SystemExit(
                      "Course dupliquee : " + cid
                  )

              ids.add(cid)

              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  raise SystemExit(
                      "Course francaise non verifiee : "
                      + cid
                  )

              if not isinstance(
                  course.get("partants"), list
              ):
                  raise SystemExit(
                      "Partants absents : " + cid
                  )

          print(
              "Collecte validee :",
              len(courses),
              "courses"
          )
          PY

      - name: "Executer l'analyse autonome M1"
        run: |
          set -euo pipefail

          mkdir -p /tmp/x1000-m1-rapports

          python m1_analyse_autonome.py \
            --source data/collecte_m1_pmu.json \
            --output /tmp/x1000-m1-rapports/propositions.json

      - name: "Valider les propositions"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "/tmp/x1000-m1-rapports/propositions.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "Rapport invalide"
              )

          if data.get("moteur") != "M1":
              raise SystemExit(
                  "Moteur incorrect"
              )

          if data.get("statut") != "PREPUBLICATION":
              raise SystemExit(
                  "Statut incorrect"
              )

          if data.get(
              "aucune_modification_figes"
          ) is not True:
              raise SystemExit(
                  "Protection FIGE absente"
              )

          if data.get(
              "validation_sportive_humaine"
          ) is not False:
              raise SystemExit(
                  "Validation non autorisee"
              )

          propositions = data.get("propositions")

          if not isinstance(propositions, list):
              raise SystemExit(
                  "Propositions : liste attendue"
              )

          ids = set()

          for item in propositions:

              if not isinstance(item, dict):
                  raise SystemExit(
                      "Proposition non structuree"
                  )

              if item.get("moteur") != "M1":
                  raise SystemExit(
                      "Moteur non autorise"
                  )

              if item.get("statut") != (
                  "PROPOSITION_NON_VALIDEE"
              ):
                  raise SystemExit(
                      "Statut proposition invalide"
                  )

              if item.get("fige") is not False:
                  raise SystemExit(
                      "FIGE non autorise"
                  )

              if item.get(
                  "publication_officielle"
              ) is not False:
                  raise SystemExit(
                      "Publication officielle interdite"
                  )

              if item.get(
                  "pari_envisage"
              ) is not None:
                  raise SystemExit(
                      "Pari automatique interdit"
                  )

              classement = item.get("classement")

              if not isinstance(classement, list):
                  raise SystemExit(
                      "Classement absent"
                  )

              if len(classement) != 5:
                  raise SystemExit(
                      "Cinq positions attendues"
                  )

              if any(
                  type(n) is not int or n <= 0
                  for n in classement
              ):
                  raise SystemExit(
                      "Numero invalide"
                  )

              if len(set(classement)) != 5:
                  raise SystemExit(
                      "Chevaux dupliques"
                  )

              cid = item.get("course_id")

              if not isinstance(cid, str):
                  raise SystemExit(
                      "Identifiant course absent"
                  )

              if cid in ids:
                  raise SystemExit(
                      "Proposition dupliquee"
                  )

              ids.add(cid)

          if (
              data.get("nombre_propositions")
              != len(propositions)
          ):
              raise SystemExit(
                  "Compteur incoherent"
              )

          print(
              "Propositions controlees :",
              len(propositions)
          )
          PY

      - name: "Verifier les archives et fichiers proteges"
        run: |
          set -euo pipefail

          python m1.py --verify-archives

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          snapshot = json.loads(
              Path("/tmp/m1-snapshot.json")
              .read_text(encoding="utf-8")
          )

          for name, expected in snapshot.items():

              path = Path(name)

              actual = (
                  hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()
                  if path.is_file()
                  else None
              )

              if actual != expected:
                  raise SystemExit(
                      "FICHIER PROTEGE MODIFIE : "
                      + name
                  )

          print(
              "Tous les fichiers proteges "
              "sont inchanges"
          )
          PY

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Modification du depot detectee"
            git status --short
            exit 1
          fi

      - name: "Archiver les rapports M1"
        uses: actions/upload-artifact@v4
        with:
          name: m1-propositions-non-validees
          path: /tmp/x1000-m1-rapports/propositions.json
          if-no-files-found: error
          retention-days: 7

      - name: "Rapport final GitHub Actions"
        if: always()
        env:
          RESULTAT: ${{ job.status }}
        run: |
          {
            echo "## X1000 M1 - Analyse autonome"
            echo ""
            echo "- Statut : ${RESULTAT}"
            echo "- Mode : prepublication"
            echo "- Collecte PMU : lecture seule"
            echo "- Moteur : M1 independant"
            echo "- Decisions officielles : non modifiees"
            echo "- FIGEs historiques : non modifies"
            echo "- Audits : non modifies"
            echo "- Aucun push GitHub"
            echo "- Aucun acces M2-M5"
            echo ""
            echo "Rapport disponible en artefact"
            echo "uniquement apres validation."
          } >> "$GITHUB_STEP_SUMMARY"
