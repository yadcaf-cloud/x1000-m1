
# MPAA X1000 - MOTEUR M1
# WORKFLOW UNIFIE ET PROTEGE
# Depot : yadcaf-cloud/x1000-m1
#
# Collecte PMU France toutes les 10 minutes.
# Tests du collecteur et du moteur M1.
# Verification des archives FIGE.
#
# PUBLICATION AUTORISEE UNIQUEMENT :
# data/collecte_m1_pmu.json
# data/diagnostic_collecte_m1.json
#
# INTERDICTIONS :
# - Aucune modification de m1.py
# - Aucune importation dans data/courses.json
# - Aucun pronostic ou pari fictif
# - Aucun FIGE cree ou modifie
# - Aucun audit ou tableau officiel modifie
# - Aucun acces aux moteurs M2 a M5
# - Aucun deploiement vers X1000 PHOENIX

name: "MPAA X1000 - M1 Unifie et Protege"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - ".github/workflows/m1.yml"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-publication
  cancel-in-progress: false

jobs:
  moteur-m1:
    name: "M1 - Collecte et controles proteges"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:

      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier le depot initial"
        run: |
          set -euo pipefail

          test -f m1.py
          test -f pmu_engine.py

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "ERREUR : depot initial non propre"
            git status --short
            exit 1
          fi

          echo "Depot M1 initial propre"

      - name: "Verifier la syntaxe sans pycache"
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              path = Path(name)
              compile(path.read_bytes(), name, "exec")
              print(name, ": syntaxe valide")
          PY

      - name: "Autotest du collecteur PMU"
        run: |
          set -euo pipefail
          python pmu_engine.py --self-test

      - name: "Autotest du moteur M1"
        run: |
          set -euo pipefail
          python m1.py --self-test

      - name: "Verifier les archives FIGE"
        run: |
          set -euo pipefail
          python m1.py --verify-archives

      - name: "Collecter les donnees PMU reelles"
        id: collecte
        continue-on-error: true
        run: |
          set -euo pipefail
          python pmu_engine.py

      - name: "Verifier la collecte PMU"
        id: verification
        if: steps.collecte.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import re

          from pathlib import Path
          from zoneinfo import ZoneInfo

          paris = ZoneInfo("Europe/Paris")
          today = dt.datetime.now(paris).date()

          def fail(message):
              raise SystemExit(
                  "COLLECTE REFUSEE : " + message
              )

          def load(name):
              path = Path("data") / name

              if not path.is_file():
                  fail("Fichier absent : " + name)

              try:
                  with path.open(encoding="utf-8") as f:
                      obj = json.load(f)
              except (OSError, ValueError) as exc:
                  fail(name + " : " + str(exc))

              if not isinstance(obj, dict):
                  fail(name + " : objet JSON attendu")

              return obj

          def parse_time(value):
              if not isinstance(value, str):
                  fail("Horodatage absent")

              try:
                  stamp = dt.datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except ValueError:
                  fail("Horodatage invalide")

              if (
                  stamp.tzinfo is None
                  or stamp.utcoffset() is None
              ):
                  fail("Fuseau horaire absent")

              return stamp

          data = load("collecte_m1_pmu.json")
          diag = load("diagnostic_collecte_m1.json")

          for label, obj in (
              ("collecte", data),
              ("diagnostic", diag)
          ):
              if obj.get("statut") != "OK":
                  fail(label + " : statut non OK")

              if obj.get("date") != today.isoformat():
                  fail(label + " : date incorrecte")

              if obj.get("erreurs"):
                  fail(label + " : erreurs presentes")

          if data.get("collecte_a") != diag.get("collecte_a"):
              fail("Horodatages differents")

          stamp = parse_time(data.get("collecte_a"))

          age = (
              dt.datetime.now(dt.timezone.utc)
              - stamp.astimezone(dt.timezone.utc)
          ).total_seconds()

          if not -60 <= age <= 1200:
              fail("Collecte ancienne ou future")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              fail("Aucune course francaise verifiee")

          pattern = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          ids = set()
          total_chevaux = 0
          total_partants = 0
          total_np = 0

          for course in courses:
              if not isinstance(course, dict):
                  fail("Course invalide")

              cid = course.get("id")

              if (
                  not isinstance(cid, str)
                  or not pattern.fullmatch(cid)
                  or cid in ids
              ):
                  fail("ID de course invalide ou duplique")

              ids.add(cid)

              if cid[:10] != today.isoformat():
                  fail(cid + " : date incorrecte")

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  fail(cid + " : France non verifiee")

              depart = parse_time(course.get("depart"))

              if depart.astimezone(paris).date() != today:
                  fail(cid + " : depart hors date")

              chevaux = course.get("partants")

              if not isinstance(chevaux, list) or not chevaux:
                  fail(cid + " : partants absents")

              numeros = set()
              np = set()

              for cheval in chevaux:
                  if not isinstance(cheval, dict):
                      fail(cid + " : cheval invalide")

                  numero = cheval.get("numero")

                  if (
                      type(numero) is not int
                      or numero <= 0
                      or numero in numeros
                  ):
                      fail(cid + " : numero invalide")

                  numeros.add(numero)

                  nom = cheval.get("nom")

                  if (
                      not isinstance(nom, str)
                      or not nom.strip()
                  ):
                      fail(cid + " : nom absent")

                  if type(cheval.get("non_partant")) is not bool:
                      fail(cid + " : statut NP invalide")

                  if cheval["non_partant"]:
                      np.add(numero)

              actifs = len(numeros) - len(np)

              if (
                  type(course.get("nombre_partants")) is not int
                  or course["nombre_partants"] != actifs
              ):
                  fail(cid + " : nombre partants incoherent")

              declared = course.get("non_partants")

              if not isinstance(declared, list):
                  fail(cid + " : liste NP absente")

              if any(type(n) is not int for n in declared):
                  fail(cid + " : numero NP invalide")

              if (
                  len(declared) != len(set(declared))
                  or set(declared) != np
              ):
                  fail(cid + " : NP incoherents")

              total_chevaux += len(numeros)
              total_partants += actifs
              total_np += len(np)

          stats = data.get("statistiques")

          if not isinstance(stats, dict):
              fail("Statistiques absentes")

          expected = {
              "courses": len(courses),
              "chevaux": total_chevaux,
              "partants": total_partants,
              "non_partants": total_np,
              "erreurs": 0
          }

          for key, value in expected.items():
              if (
                  type(stats.get(key)) is not int
                  or stats[key] != value
              ):
                  fail("Statistique incoherente : " + key)

          if diag.get("statistiques") != stats:
              fail("Diagnostic statistique incoherent")

          print("COLLECTE PMU VALIDEE")
          print("Courses :", len(courses))
          print("Chevaux :", total_chevaux)
          print("Partants :", total_partants)
          print("Non-partants :", total_np)
          print("Aucun pronostic genere")
          print("Aucun FIGE genere")
          PY

      - name: "Reverifier les FIGE historiques"
        id: archives
        if: steps.verification.outcome == 'success'
        run: |
          set -euo pipefail
          python m1.py --verify-archives

      - name: "Verifier les fichiers modifies"
        id: protection
        if: steps.archives.outcome == 'success'
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output([
              "git",
              "status",
              "--porcelain",
              "-z",
              "--untracked-files=all"
          ])

          entries = raw.split(b"\0")
          changed = set()

          for entry in entries:
              if not entry:
                  continue

              if len(entry) < 4 or entry[2:3] != b" ":
                  raise SystemExit(
                      "Entree Git invalide"
                  )

              status = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8")

              if "R" in status or "C" in status:
                  raise SystemExit(
                      "Renommage ou copie interdit : " + path
                  )

              if "D" in status or "U" in status:
                  raise SystemExit(
                      "Suppression ou conflit interdit : " + path
                  )

              changed.add(path)

          unexpected = changed - allowed

          if unexpected:
              raise SystemExit(
                  "Fichiers proteges modifies : "
                  + ", ".join(sorted(unexpected))
              )

          print("Isolation M1 validee")
          print("Aucun fichier protege modifie")
          PY

      - name: "Publier uniquement les deux JSON PMU"
        id: publication
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.protection.outcome == 'success'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/collecte_m1_pmu.json \
            data/diagnostic_collecte_m1.json

          python - <<'PY'
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output([
              "git",
              "diff",
              "--cached",
              "--name-status",
              "-z"
          ])

          entries = raw.split(b"\0")
          i = 0
          staged = set()

          while i < len(entries):
              status = entries[i]
              i += 1

              if not status:
                  continue

              if i >= len(entries):
                  raise SystemExit(
                      "Index Git incomplet"
                  )

              path = entries[i].decode("utf-8")
              i += 1

              if status not in (b"A", b"M"):
                  raise SystemExit(
                      "Operation Git interdite : " + path
                  )

              staged.add(path)

          if not staged <= allowed:
              raise SystemExit(
                  "Publication hors perimetre M1"
              )

          print("Index Git valide")
          PY

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "M1: collecte PMU France verifiee"

          # Aucun push force.
          # En cas de divergence, echec sans
          # reecriture de l'historique.
          git push origin HEAD:main

      - name: "Rapport final M1"
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          VERIFICATION: ${{ steps.verification.outcome }}
          ARCHIVES: ${{ steps.archives.outcome }}
          PROTECTION: ${{ steps.protection.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          {
            echo "## MPAA X1000 - M1 unifie"
            echo ""
            echo "- Collecte : ${COLLECTE}"
            echo "- Verification PMU : ${VERIFICATION}"
            echo "- Archives FIGE : ${ARCHIVES}"
            echo "- Protection : ${PROTECTION}"
            echo "- Publication : ${PUBLICATION}"
            echo "- Frequence prevue : 10 minutes"
            echo "- Fuseau : Europe/Paris"
            echo ""
            echo "### Protections"
            echo ""
            echo "- Pronostics : non modifies"
            echo "- Selections : non modifiees"
            echo "- FIGE : non modifies"
            echo "- Audits : non modifies"
            echo "- Tableau officiel : non modifie"
            echo "- M2 a M5 : non modifies"
            echo "- Importation M1 : desactivee"
            echo ""
            echo "Aucune donnee hippique inventee."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler tout echec"
        if: >-
          always() &&
          (
            steps.collecte.outcome != 'success' ||
            steps.verification.outcome != 'success' ||
            steps.archives.outcome != 'success' ||
            steps.protection.outcome != 'success' ||
            steps.publication.outcome != 'success'
          )
        run: |
          echo "ECHEC : collecte ou publication non validee"
          exit 1
