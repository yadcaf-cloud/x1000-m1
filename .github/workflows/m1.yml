# 🇸🇳🧠🔥 MPAA X1000 — M1
# WORKFLOW UNIQUE ET PROTEGE
#
# Depot : yadcaf-cloud/x1000-m1
#
# Collecte PMU France toutes les 10 minutes.
# Aucune analyse sportive automatique.
# Aucun pronostic, pari ou FIGE genere.
#
# PUBLICATIONS EXCLUSIVES :
# data/collecte_m1_pmu.json
# data/diagnostic_collecte_m1.json
#
# Aucun acces a M2-M5.
# Aucun deploiement vers X1000 PHOENIX.
# Aucun push force.

name: "MPAA X1000 - M1 Unifie et Protege"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - ".github/workflows/m1.yml"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-publication
  cancel-in-progress: false

jobs:
  moteur-m1:
    name: "M1 - Collecte et controles proteges"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier le depot et les programmes"
        run: |
          set -euo pipefail

          test -f m1.py
          test -f pmu_engine.py

          test -z "$(git status --porcelain --untracked-files=all)"

          python - <<'PY'
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print(name, "syntaxe OK")
          PY

      - name: "Enregistrer les fichiers proteges"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          def snapshot():
              result = {}

              def scan(folder):
                  with os.scandir(folder) as entries:
                      for entry in entries:
                          path = Path(entry.path)
                          name = path.as_posix()

                          if name == ".git" or name in allowed:
                              continue

                          mode = entry.stat(
                              follow_symlinks=False
                          ).st_mode

                          if stat.S_ISDIR(mode):
                              result[name] = "DIR"
                              scan(path)

                          elif stat.S_ISLNK(mode):
                              result[name] = (
                                  "LINK:" + os.readlink(path)
                              )

                          elif stat.S_ISREG(mode):
                              result[name] = (
                                  "FILE:" +
                                  hashlib.sha256(
                                      path.read_bytes()
                                  ).hexdigest()
                              )

                          else:
                              result[name] = (
                                  "SPECIAL:" + str(mode)
                              )

              scan(Path("."))
              return result

          Path("/tmp/m1-protection.json").write_text(
              json.dumps(snapshot(), sort_keys=True),
              encoding="utf-8"
          )

          print("Etat initial protege")
          PY

      - name: "Tester les programmes M1"
        run: |
          set -euo pipefail

          test "$M1_AUTO_ANALYZE" = "false"

          python pmu_engine.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

          echo "Tests M1 termines"

      - name: "Collecter les donnees PMU France"
        id: collecte
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          Path("/tmp/m1-start").write_text(
              datetime.now(timezone.utc).isoformat(),
              encoding="utf-8"
          )
          PY

          python pmu_engine.py

      - name: "Verifier la collecte et les JSON"
        id: validation
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          UTC = dt.timezone.utc
          PARIS = ZoneInfo("Europe/Paris")

          def fail(message):
              raise SystemExit(
                  "PUBLICATION REFUSEE : " + message
              )

          def stamp(value):
              if not isinstance(value, str):
                  fail("Horodatage absent")

              try:
                  d = dt.datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )

                  if d.tzinfo is None:
                      raise ValueError("Fuseau absent")

                  return d.astimezone(UTC)

              except ValueError as exc:
                  fail("Horodatage invalide : " + str(exc))

          def pairs(items):
              result = {}

              for key, value in items:
                  if key in result:
                      fail("Cle JSON dupliquee : " + key)
                  result[key] = value

              return result

          def constant(value):
              fail("Constante JSON interdite : " + value)

          start = stamp(
              Path("/tmp/m1-start")
              .read_text(encoding="utf-8")
              .strip()
          )

          now = dt.datetime.now(UTC)
          today = now.astimezone(PARIS).date()

          if start.astimezone(PARIS).date() != today:
              fail("Collecte traversant minuit Paris")

          objects = {}

          for filename in (
              "collecte_m1_pmu.json",
              "diagnostic_collecte_m1.json"
          ):
              path = Path("data") / filename

              if not path.is_file() or path.is_symlink():
                  fail(filename + " absent ou lien")

              modified = dt.datetime.fromtimestamp(
                  path.stat().st_mtime,
                  tz=UTC
              )

              if modified < start - dt.timedelta(seconds=2):
                  fail(filename + " non actualise")

              if modified > now + dt.timedelta(seconds=60):
                  fail(filename + " date future")

              try:
                  obj = json.loads(
                      path.read_text(encoding="utf-8"),
                      object_pairs_hook=pairs,
                      parse_constant=constant
                  )

              except (OSError, ValueError) as exc:
                  fail(filename + " : " + str(exc))

              if not isinstance(obj, dict):
                  fail(filename + " : objet attendu")

              if obj.get("date") != today.isoformat():
                  fail(filename + " : date incorrecte")

              if obj.get("statut") != "OK":
                  fail(filename + " : collecte non OK")

              if obj.get("erreurs"):
                  fail(filename + " : erreurs presentes")

              when = stamp(obj.get("collecte_a"))

              if when < start - dt.timedelta(seconds=60):
                  fail(filename + " : collecte ancienne")

              if when > now + dt.timedelta(seconds=60):
                  fail(filename + " : collecte future")

              objects[filename] = obj

          data = objects["collecte_m1_pmu.json"]
          diag = objects["diagnostic_collecte_m1.json"]

          if stamp(data["collecte_a"]) != stamp(
              diag["collecte_a"]
          ):
              fail("Horodatages differents")

          stats = data.get("statistiques")

          if not isinstance(stats, dict):
              fail("Statistiques absentes")

          if stats != diag.get("statistiques"):
              fail("Statistiques differentes")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              fail("Aucune course verifiee")

          ids = set()
          total_chevaux = 0
          total_partants = 0
          total_np = 0

          for course in courses:
              if not isinstance(course, dict):
                  fail("Course invalide")

              cid = course.get("id")

              if (
                  not isinstance(cid, str)
                  or not re.fullmatch(
                      r"\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*",
                      cid
                  )
                  or cid in ids
              ):
                  fail("ID course invalide ou duplique")

              ids.add(cid)

              if cid[:10] != today.isoformat():
                  fail(cid + " : date incorrecte")

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  fail(cid + " : France non verifiee")

              depart = stamp(course.get("depart"))

              if depart.astimezone(PARIS).date() != today:
                  fail(cid + " : depart hors date")

              chevaux = course.get("partants")

              if not isinstance(chevaux, list) or not chevaux:
                  fail(cid + " : chevaux absents")

              numeros = set()
              np = set()

              for cheval in chevaux:
                  if not isinstance(cheval, dict):
                      fail(cid + " : cheval invalide")

                  numero = cheval.get("numero")

                  if (
                      type(numero) is not int
                      or numero <= 0
                      or numero in numeros
                  ):
                      fail(cid + " : numero invalide")

                  numeros.add(numero)

                  nom = cheval.get("nom")

                  if (
                      not isinstance(nom, str)
                      or not nom.strip()
                  ):
                      fail(cid + " : nom invalide")

                  if type(
                      cheval.get("non_partant")
                  ) is not bool:
                      fail(cid + " : NP invalide")

                  if cheval["non_partant"]:
                      np.add(numero)

              declared = course.get("non_partants")

              if not isinstance(declared, list):
                  fail(cid + " : NP absents")

              if any(
                  type(n) is not int
                  for n in declared
              ):
                  fail(cid + " : numero NP invalide")

              if (
                  len(declared) != len(set(declared))
                  or set(declared) != np
              ):
                  fail(cid + " : NP incoherents")

              actifs = len(numeros) - len(np)

              if (
                  type(course.get("nombre_partants")) is not int
                  or course["nombre_partants"] != actifs
              ):
                  fail(cid + " : total partants incorrect")

              total_chevaux += len(numeros)
              total_partants += actifs
              total_np += len(np)

          print("COLLECTE VALIDEE")
          print("Courses :", len(courses))
          print("Chevaux :", total_chevaux)
          print("Partants :", total_partants)
          print("Non-partants :", total_np)
          PY

      - name: "Verifier archives et fichiers proteges"
        id: protection
        run: |
          set -euo pipefail

          python m1.py --verify-archives

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          initial = json.loads(
              Path("/tmp/m1-protection.json")
              .read_text(encoding="utf-8")
          )

          def snapshot():
              result = {}

              def scan(folder):
                  with os.scandir(folder) as entries:
                      for entry in entries:
                          path = Path(entry.path)
                          name = path.as_posix()

                          if name == ".git" or name in allowed:
                              continue

                          mode = entry.stat(
                              follow_symlinks=False
                          ).st_mode

                          if stat.S_ISDIR(mode):
                              result[name] = "DIR"
                              scan(path)

                          elif stat.S_ISLNK(mode):
                              result[name] = (
                                  "LINK:" + os.readlink(path)
                              )

                          elif stat.S_ISREG(mode):
                              result[name] = (
                                  "FILE:" +
                                  hashlib.sha256(
                                      path.read_bytes()
                                  ).hexdigest()
                              )

                          else:
                              result[name] = (
                                  "SPECIAL:" + str(mode)
                              )

              scan(Path("."))
              return result

          current = snapshot()

          if current != initial:
              changed = sorted(
                  name
                  for name in set(initial) | set(current)
                  if initial.get(name) != current.get(name)
              )

              raise SystemExit(
                  "FICHIERS PROTEGES MODIFIES : "
                  + ", ".join(changed)
              )

          for filename in allowed:
              path = Path(filename)

              if not path.is_file() or path.is_symlink():
                  raise SystemExit(
                      "JSON absent ou lien : " + filename
                  )

          raw = subprocess.check_output([
              "git",
              "status",
              "--porcelain=v1",
              "-z",
              "--untracked-files=all"
          ])

          for entry in filter(None, raw.split(b"\0")):
              status = entry[:2].decode("ascii")
              name = entry[3:].decode("utf-8")

              if (
                  status not in (
                      " M", "M ", "MM", "??", "A "
                  )
                  or name not in allowed
              ):
                  raise SystemExit(
                      "Operation Git interdite : "
                      + repr((status, name))
                  )

          print("Protection des fichiers validee")
          PY

      - name: "Publier uniquement les JSON valides"
        id: publication
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/m1-publication

          cp -- \
            data/collecte_m1_pmu.json \
            /tmp/m1-publication/

          cp -- \
            data/diagnostic_collecte_m1.json \
            /tmp/m1-publication/

          for tentative in 1 2 3 4 5; do
            echo "Tentative ${tentative}/5"

            git fetch origin main

            python - <<'PY'
          import datetime as dt
          import json
          import subprocess
          from pathlib import Path

          files = (
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          )

          def stamp(value):
              if not isinstance(value, str):
                  raise ValueError("Horodatage absent")

              d = dt.datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if d.tzinfo is None:
                  raise ValueError("Fuseau absent")

              return d.astimezone(dt.timezone.utc)

          for name in files:
              local = json.loads(
                  (
                      Path("/tmp/m1-publication")
                      / Path(name).name
                  ).read_text(encoding="utf-8")
              )

              remote = subprocess.run(
                  [
                      "git", "show",
                      "origin/main:" + name
                  ],
                  capture_output=True,
                  text=True
              )

              if remote.returncode != 0:
                  continue

              try:
                  other = json.loads(remote.stdout)

                  if stamp(other["collecte_a"]) >= stamp(
                      local["collecte_a"]
                  ):
                      raise SystemExit(
                          "Publication distante aussi recente "
                          "ou plus recente : " + name
                      )

              except (
                  ValueError,
                  KeyError,
                  TypeError,
                  AttributeError
              ) as exc:
                  raise SystemExit(
                      "JSON distant non verifiable : "
                      + name + " : " + str(exc)
                  )

          print("Fraicheur distante controlee")
          PY

            # Reset local au runner GitHub uniquement.
            # Aucun push force.

            git reset --hard origin/main

            mkdir -p data

            cp -- \
              /tmp/m1-publication/collecte_m1_pmu.json \
              data/collecte_m1_pmu.json

            cp -- \
              /tmp/m1-publication/diagnostic_collecte_m1.json \
              data/diagnostic_collecte_m1.json

            git add -- \
              data/collecte_m1_pmu.json \
              data/diagnostic_collecte_m1.json

            python - <<'PY'
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output([
              "git",
              "diff",
              "--cached",
              "--name-status",
              "-z"
          ])

          parts = list(filter(None, raw.split(b"\0")))

          if len(parts) % 2:
              raise SystemExit("Index Git invalide")

          for i in range(0, len(parts), 2):
              status = parts[i]
              name = parts[i + 1].decode("utf-8")

              if (
                  status not in (b"A", b"M")
                  or name not in allowed
              ):
                  raise SystemExit(
                      "Publication interdite : " + name
                  )

          print("Index Git protege")
          PY

            if git diff --cached --quiet; then
              echo "Aucun changement a publier"
              exit 0
            fi

            git commit -m \
              "M1: collecte PMU France controlee"

            if git push origin HEAD:main; then
              echo "PUBLICATION M1 REUSSIE"
              exit 0
            fi

            echo "Conflit Git detecte"

            if [ "$tentative" -lt 5 ]; then
              sleep 5
            fi
          done

          echo "ECHEC DE PUBLICATION"
          exit 1

      - name: "Rapport final"
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          VALIDATION: ${{ steps.validation.outcome }}
          PROTECTION: ${{ steps.protection.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          {
            echo "## MPAA X1000 - M1"
            echo ""
            echo "- Collecte : ${COLLECTE}"
            echo "- Validation JSON : ${VALIDATION}"
            echo "- Protection fichiers : ${PROTECTION}"
            echo "- Publication : ${PUBLICATION}"
            echo ""
            echo "### Protections"
            echo "- Autonomie sportive desactivee"
            echo "- FIGE : verification uniquement"
            echo "- Aucun pronostic automatique"
            echo "- Aucun push force"
            echo "- Aucun acces M2-M5"
            echo "- Aucun deploiement PHOENIX"
            echo "- Collecte programmee : 10 minutes"
            echo "- GitHub peut retarder les executions"
          } >> "$GITHUB_STEP_SUMMARY"
