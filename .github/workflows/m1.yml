# MPAA X1000 M1 - Collecte officielle protegee
# Publications exclusives :
# data/collecte_m1_pmu.json
# data/diagnostic_collecte_m1.json
#
# Aucun pronostic, pari, FIGE ou deploiement.
# Aucun acces M2-M5. Aucun push force.

name: "MPAA X1000 - M1 Unifie Protege V2.1"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - ".github/workflows/m1.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-publication
  cancel-in-progress: false

jobs:
  collecte:
    name: "M1 - Collecte PMU France protegee"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier fichiers et syntaxe"
        run: |
          set -euo pipefail

          test "$M1_AUTO_ANALYZE" = "false"
          test -f m1.py
          test -f pmu_engine.py
          test -d data

          python - <<'PY'
          import ast
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              ast.parse(
                  Path(name).read_text(
                      encoding="utf-8-sig"
                  ),
                  filename=name
              )
              print("Syntaxe OK :", name)
          PY

          test -z "$(
            git status --porcelain \
              --untracked-files=all
          )"

      - name: "Enregistrer empreintes protegees"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          snapshot = {}

          for item in raw.split(b"\0"):
              if not item:
                  continue

              name = os.fsdecode(item)
              path = Path(name)

              if path.is_symlink() or not path.is_file():
                  raise SystemExit(
                      "Fichier suivi non regulier : " + name
                  )

              if name not in allowed:
                  snapshot[name] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()

          output = (
              Path(os.environ["RUNNER_TEMP"])
              / "m1-protection.json"
          )

          output.write_text(
              json.dumps(snapshot, sort_keys=True),
              encoding="utf-8"
          )

          print("Fichiers proteges :", len(snapshot))
          PY

      - name: "Tester M1 et les archives"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

          echo "Autotests termines"

      - name: "Collecter PMU France"
        id: collecte
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "m1-start.txt"
          )

          path.write_text(
              dt.datetime.now(
                  dt.timezone.utc
              ).isoformat(),
              encoding="utf-8"
          )
          PY

          python pmu_engine.py

      - name: "Valider les publications JSON"
        id: validation
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          UTC = dt.timezone.utc
          PARIS = ZoneInfo("Europe/Paris")

          def fail(message):
              raise SystemExit(
                  "PUBLICATION REFUSEE : " + message
              )

          def stamp(value):
              if not isinstance(value, str):
                  fail("Horodatage absent")

              try:
                  value = dt.datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except ValueError:
                  fail("Horodatage incorrect")

              if (
                  value.tzinfo is None
                  or value.utcoffset() is None
              ):
                  fail("Fuseau horaire absent")

              return value.astimezone(UTC)

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      fail(
                          "Cle JSON dupliquee : " + key
                      )
                  result[key] = value
              return result

          def reject(value):
              fail(
                  "Constante JSON interdite : " + value
              )

          def lire(path):
              if path.is_symlink() or not path.is_file():
                  fail("Fichier absent : " + str(path))

              try:
                  result = json.loads(
                      path.read_text(
                          encoding="utf-8-sig"
                      ),
                      object_pairs_hook=pairs,
                      parse_constant=reject
                  )
              except (OSError, ValueError) as exc:
                  fail(str(path) + " : " + str(exc))

              if not isinstance(result, dict):
                  fail("Objet JSON attendu")

              return result

          temp = Path(os.environ["RUNNER_TEMP"])

          start = stamp(
              (temp / "m1-start.txt")
              .read_text(encoding="utf-8")
              .strip()
          )

          now = dt.datetime.now(UTC)
          today = now.astimezone(PARIS).date()

          if start.astimezone(PARIS).date() != today:
              fail("Collecte traversant minuit Paris")

          names = (
              "collecte_m1_pmu.json",
              "diagnostic_collecte_m1.json"
          )

          objects = {}

          for name in names:
              path = Path("data") / name
              obj = lire(path)

              modified = dt.datetime.fromtimestamp(
                  path.stat().st_mtime,
                  tz=UTC
              )

              if modified < start - dt.timedelta(
                  seconds=2
              ):
                  fail(name + " non actualise")

              if modified > now + dt.timedelta(
                  seconds=60
              ):
                  fail(name + " date future")

              if obj.get("date") != today.isoformat():
                  fail(name + " hors date Paris")

              if obj.get("statut") != "OK":
                  fail(name + " : statut non OK")

              if obj.get("erreurs") != []:
                  fail(name + " : erreurs presentes")

              collected = stamp(
                  obj.get("collecte_a")
              )

              if collected < start - dt.timedelta(
                  seconds=60
              ):
                  fail(name + " collecte ancienne")

              if collected > now + dt.timedelta(
                  seconds=60
              ):
                  fail(name + " collecte future")

              objects[name] = obj

          data = objects[names[0]]
          diag = objects[names[1]]

          if stamp(data["collecte_a"]) != stamp(
              diag["collecte_a"]
          ):
              fail("Horodatages differents")

          stats = data.get("statistiques")

          if (
              not isinstance(stats, dict)
              or stats != diag.get("statistiques")
          ):
              fail("Statistiques incoherentes")

          courses = data.get("courses")

          if (
              not isinstance(courses, list)
              or not courses
          ):
              fail("Aucune course valide")

          ids = set()
          total_chevaux = 0
          total_partants = 0
          total_np = 0

          pattern = (
              r"\d{4}-\d{2}-\d{2}"
              r"-R[1-9]\d*-C[1-9]\d*"
          )

          for course in courses:
              if not isinstance(course, dict):
                  fail("Course non structuree")

              cid = course.get("id")

              if (
                  not isinstance(cid, str)
                  or not re.fullmatch(pattern, cid)
                  or cid in ids
                  or not cid.startswith(
                      today.isoformat() + "-"
                  )
              ):
                  fail("Identifiant invalide ou double")

              ids.add(cid)

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  fail(cid + " France non verifiee")

              depart = stamp(
                  course.get("depart")
              )

              if depart.astimezone(
                  PARIS
              ).date() != today:
                  fail(cid + " depart hors date")

              horses = course.get("partants")

              if (
                  not isinstance(horses, list)
                  or not horses
              ):
                  fail(cid + " chevaux absents")

              numbers = set()
              non_runners = set()

              for horse in horses:
                  if not isinstance(horse, dict):
                      fail(cid + " cheval invalide")

                  number = horse.get("numero")

                  if (
                      type(number) is not int
                      or number <= 0
                      or number in numbers
                  ):
                      fail(cid + " numero invalide")

                  numbers.add(number)

                  name = horse.get("nom")

                  if (
                      not isinstance(name, str)
                      or not name.strip()
                  ):
                      fail(cid + " nom invalide")

                  if type(
                      horse.get("non_partant")
                  ) is not bool:
                      fail(cid + " NP invalide")

                  if horse["non_partant"]:
                      non_runners.add(number)

              declared = course.get(
                  "non_partants"
              )

              if (
                  not isinstance(declared, list)
                  or any(
                      type(n) is not int
                      for n in declared
                  )
                  or len(declared)
                  != len(set(declared))
                  or set(declared) != non_runners
              ):
                  fail(cid + " NP incoherents")

              active = (
                  len(numbers) - len(non_runners)
              )

              if (
                  type(
                      course.get("nombre_partants")
                  ) is not int
                  or course["nombre_partants"]
                  != active
              ):
                  fail(
                      cid + " nombre_partants invalide"
                  )

              total_chevaux += len(numbers)
              total_partants += active
              total_np += len(non_runners)

          expected = {
              "courses": len(courses),
              "chevaux": total_chevaux,
              "partants": total_partants,
              "non_partants": total_np,
              "erreurs": 0
          }

          for key, value in expected.items():
              if (
                  type(stats.get(key)) is not int
                  or stats[key] != value
              ):
                  fail(
                      "Statistique incorrecte : " + key
                  )

          print("COLLECTE VALIDEE")
          print("Courses :", len(courses))
          print("Chevaux :", total_chevaux)
          print("Partants :", total_partants)
          print("Non-partants :", total_np)
          PY

      - name: "Verifier les fichiers proteges"
        id: protection
        run: |
          set -euo pipefail

          python m1.py --verify-archives

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          snapshot = (
              Path(os.environ["RUNNER_TEMP"])
              / "m1-protection.json"
          )

          initial = json.loads(
              snapshot.read_text(
                  encoding="utf-8"
              )
          )

          current = {}

          raw = subprocess.check_output(
              ["git", "ls-files", "-z"]
          )

          for item in raw.split(b"\0"):
              if not item:
                  continue

              name = os.fsdecode(item)
              path = Path(name)

              if (
                  path.is_symlink()
                  or not path.is_file()
              ):
                  raise SystemExit(
                      "Fichier non regulier : " + name
                  )

              if name not in allowed:
                  current[name] = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()

          if current != initial:
              raise SystemExit(
                  "Fichiers proteges modifies"
              )

          raw = subprocess.check_output([
              "git",
              "status",
              "--porcelain=v1",
              "-z",
              "--untracked-files=all"
          ])

          parts = [
              p for p in raw.split(b"\0") if p
          ]

          for part in parts:
              status = part[:2].decode("ascii")
              name = os.fsdecode(part[3:])

              if (
                  status not in (
                      " M", "M ", "MM", "??"
                  )
                  or name not in allowed
              ):
                  raise SystemExit(
                      "Modification interdite : " + name
                  )

          print("Fichiers proteges intacts")
          PY

      - name: "Publier les deux JSON seulement"
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -n "$GH_TOKEN"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Verifier que main n'a pas change
          # depuis le checkout.

          git -c \
            http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch origin main

          if test "$(git rev-parse HEAD)" != \
            "$(git rev-parse origin/main)"; then
            echo "::error::main a change"
            echo "Publication refusee sans reset"
            exit 1
          fi

          python - <<'PY'
          import datetime as dt
          import json
          import subprocess
          from pathlib import Path

          files = (
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          )

          def stamp(value):
              d = dt.datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )
              if (
                  d.tzinfo is None
                  or d.utcoffset() is None
              ):
                  raise ValueError(
                      "Horodatage sans fuseau"
                  )
              return d.astimezone(
                  dt.timezone.utc
              )

          for name in files:
              local = json.loads(
                  Path(name).read_text(
                      encoding="utf-8-sig"
                  )
              )

              remote = subprocess.run(
                  [
                      "git", "show",
                      "origin/main:" + name
                  ],
                  capture_output=True,
                  text=True
              )

              if remote.returncode != 0:
                  continue

              other = json.loads(remote.stdout)

              if stamp(other["collecte_a"]) > stamp(
                  local["collecte_a"]
              ):
                  raise SystemExit(
                      "Collecte distante plus recente : "
                      + name
                  )

          print("Fraicheur distante verifiee")
          PY

          git add -- \
            data/collecte_m1_pmu.json \
            data/diagnostic_collecte_m1.json

          python - <<'PY'
          import os
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output([
              "git",
              "diff",
              "--cached",
              "--name-only",
              "-z"
          ])

          changed = {
              os.fsdecode(p)
              for p in raw.split(b"\0") if p
          }

          if not changed.issubset(allowed):
              raise SystemExit(
                  "Publication non autorisee"
              )

          print("Fichiers publies :", sorted(changed))
          PY

          if git diff --cached --quiet; then
            echo "Aucun changement a publier"
            exit 0
          fi

          git commit -m \
            "M1: collecte PMU France verifiee"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          git -c \
            "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin HEAD:main

          echo "PUBLICATION REUSSIE"

      - name: "Rapport final"
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          VALIDATION: ${{ steps.validation.outcome }}
          PROTECTION: ${{ steps.protection.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          {
            echo "## MPAA X1000 M1 - V2.1"
            echo ""
            echo "- Collecte : ${COLLECTE}"
            echo "- Validation : ${VALIDATION}"
            echo "- Protection : ${PROTECTION}"
            echo "- Publication : ${PUBLICATION}"
            echo ""
            echo "- Publications : deux JSON PMU"
            echo "- Analyse sportive : desactivee"
            echo "- Aucun pronostic automatique"
            echo "- Aucun FIGE cree"
            echo "- Aucun push force"
            echo "- Aucun deploiement PHOENIX"
            echo "- Frequence : 10 minutes"
          } >> "$GITHUB_STEP_SUMMARY"
