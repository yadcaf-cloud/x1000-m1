# 🇸🇳🧠🔥 MPAA X1000 - M1
# WORKFLOW UNIQUE ET PROTEGE
#
# Collecte PMU France toutes les 10 minutes.
# Protection des fichiers suivis, non suivis
# et ignores par Git.
#
# Publication collecte uniquement :
# - data/collecte_m1_pmu.json
# - data/diagnostic_collecte_m1.json
#
# Aucune modification sportive automatique
# tant que le moteur autonome n'est pas
# implemente et explicitement active.

name: "MPAA X1000 - M1 Unifie et Protege"

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - ".github/workflows/m1.yml"

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-publication
  cancel-in-progress: false

jobs:
  moteur-m1:
    name: "M1 - Collecte et controles proteges"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

      # Activation interdite tant que la
      # commande autonome n'existe pas.
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les fichiers requis"
        run: |
          set -euo pipefail

          test -f m1.py
          test -f pmu_engine.py

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Depot initial non propre"
            exit 1
          fi

      - name: "Enregistrer l'etat initial protege"
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          def snapshot():
              result = {}

              for path in root.rglob("*"):
                  if ".git" in path.parts:
                      continue

                  if not path.is_file():
                      continue

                  name = path.as_posix()

                  if name in allowed:
                      continue

                  digest = hashlib.sha256(
                      path.read_bytes()
                  ).hexdigest()

                  result[name] = digest

              return result

          Path("/tmp/m1_protection.json").write_text(
              json.dumps(snapshot(), sort_keys=True),
              encoding="utf-8"
          )

          print("Etat initial protege enregistre")
          PY

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print(name, ": syntaxe OK")
          PY

      - name: "Tester le collecteur"
        run: |
          set -euo pipefail
          python pmu_engine.py --self-test

      - name: "Tester le moteur M1"
        run: |
          set -euo pipefail
          python m1.py --self-test

      - name: "Verifier les archives FIGE"
        run: |
          set -euo pipefail
          python m1.py --verify-archives

      - name: "Enregistrer le debut de collecte"
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          Path("/tmp/m1_collecte_start").write_text(
              datetime.now(timezone.utc).isoformat(),
              encoding="utf-8"
          )
          PY

      - name: "Collecter les courses PMU"
        id: collecte
        run: |
          set -euo pipefail
          python pmu_engine.py

      - name: "Verifier la fraicheur des JSON"
        id: fraicheur
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from zoneinfo import ZoneInfo

          utc = dt.timezone.utc
          paris = ZoneInfo("Europe/Paris")

          def fail(message):
              raise SystemExit(
                  "COLLECTE REFUSEE : " + message
              )

          def timestamp(value):
              if not isinstance(value, str):
                  fail("Horodatage absent")

              try:
                  result = dt.datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except ValueError:
                  fail("Horodatage invalide")

              if result.tzinfo is None:
                  fail("Horodatage sans fuseau")

              return result.astimezone(utc)

          start = timestamp(
              Path("/tmp/m1_collecte_start")
              .read_text(encoding="utf-8")
              .strip()
          )

          now = dt.datetime.now(utc)
          today = start.astimezone(paris).date()

          objects = {}

          for filename in (
              "collecte_m1_pmu.json",
              "diagnostic_collecte_m1.json"
          ):
              path = Path("data") / filename

              if not path.is_file():
                  fail(filename + " absent")

              modified = dt.datetime.fromtimestamp(
                  path.stat().st_mtime,
                  tz=utc
              )

              if modified < start:
                  fail(filename + " non actualise")

              if modified > now + dt.timedelta(seconds=60):
                  fail(filename + " date dans le futur")

              try:
                  obj = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except (OSError, ValueError) as exc:
                  fail(filename + " : " + str(exc))

              if not isinstance(obj, dict):
                  fail(filename + " : objet attendu")

              if obj.get("date") != today.isoformat():
                  fail(filename + " : mauvaise date")

              if obj.get("statut") != "OK":
                  fail(filename + " : statut non OK")

              if obj.get("erreurs"):
                  fail(filename + " : erreurs presentes")

              stamp = timestamp(obj.get("collecte_a"))

              if stamp < start - dt.timedelta(seconds=60):
                  fail(filename + " : ancienne collecte")

              if stamp > now + dt.timedelta(seconds=60):
                  fail(filename + " : horodatage futur")

              objects[filename] = obj

          data = objects["collecte_m1_pmu.json"]
          diag = objects["diagnostic_collecte_m1.json"]

          if data["collecte_a"] != diag["collecte_a"]:
              fail("Horodatages differents")

          if data.get("statistiques") != diag.get("statistiques"):
              fail("Statistiques differentes")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              fail("Aucune course verifiee")

          ids = set()
          total_chevaux = 0
          total_partants = 0
          total_np = 0

          for course in courses:
              if not isinstance(course, dict):
                  fail("Course invalide")

              cid = course.get("id")

              if not isinstance(cid, str) or cid in ids:
                  fail("ID course absent ou duplique")

              ids.add(cid)

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  fail(cid + " : France non verifiee")

              if cid[:10] != today.isoformat():
                  fail(cid + " : date incorrecte")

              depart = timestamp(course.get("depart"))

              if depart.astimezone(paris).date() != today:
                  fail(cid + " : depart hors date")

              chevaux = course.get("partants")

              if not isinstance(chevaux, list) or not chevaux:
                  fail(cid + " : chevaux absents")

              numeros = set()
              np = set()

              for cheval in chevaux:
                  if not isinstance(cheval, dict):
                      fail(cid + " : cheval invalide")

                  numero = cheval.get("numero")

                  if (
                      type(numero) is not int
                      or numero <= 0
                      or numero in numeros
                  ):
                      fail(cid + " : numero invalide")

                  numeros.add(numero)

                  if not isinstance(cheval.get("nom"), str):
                      fail(cid + " : nom invalide")

                  if not cheval["nom"].strip():
                      fail(cid + " : nom vide")

                  if type(cheval.get("non_partant")) is not bool:
                      fail(cid + " : NP invalide")

                  if cheval["non_partant"]:
                      np.add(numero)

              declared = course.get("non_partants")

              if not isinstance(declared, list):
                  fail(cid + " : NP absents")

              if any(type(n) is not int for n in declared):
                  fail(cid + " : numero NP invalide")

              if (
                  len(declared) != len(set(declared))
                  or set(declared) != np
              ):
                  fail(cid + " : NP incoherents")

              actifs = len(numeros) - len(np)

              if course.get("nombre_partants") != actifs:
                  fail(cid + " : total incorrect")

              total_chevaux += len(numeros)
              total_partants += actifs
              total_np += len(np)

          stats = data.get("statistiques")

          if not isinstance(stats, dict):
              fail("Statistiques absentes")

          expected = {
              "courses": len(courses),
              "chevaux": total_chevaux,
              "partants": total_partants,
              "non_partants": total_np,
              "erreurs": 0
          }

          for key, value in expected.items():
              if type(stats.get(key)) is not int:
                  fail("Statistique invalide : " + key)

              if stats[key] != value:
                  fail("Statistique incoherente : " + key)

          print("COLLECTE FRAICHE ET VERIFIEE")
          print("Courses :", len(courses))
          print("Chevaux :", total_chevaux)
          print("Partants :", total_partants)
          print("Non-partants :", total_np)
          PY

      - name: "Etat de l'autonomie sportive M1"
        id: autonomie
        run: |
          set -euo pipefail

          if [ "$M1_AUTO_ANALYZE" != "true" ]; then
            echo "Analyse sportive autonome non activee."
            echo "Aucune decision fictive produite."
            exit 0
          fi

          # Activation future uniquement.
          # Exige une commande reelle dans m1.py.
          if ! python m1.py --help | grep -q -- '--auto-analyze'; then
            echo "ERREUR : commande autonome absente"
            exit 1
          fi

          # Aucune execution automatique de cette
          # commande tant que son contrat de sortie
          # et ses protections ne sont pas verifies.
          echo "Commande detectee, activation a valider."
          exit 1

      - name: "Reverifier les FIGE"
        id: archives
        run: |
          set -euo pipefail
          python m1.py --verify-archives

      - name: "Verifier tous les fichiers proteges"
        id: protection
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          initial = json.loads(
              Path("/tmp/m1_protection.json")
              .read_text(encoding="utf-8")
          )

          current = {}

          for path in Path(".").rglob("*"):
              if ".git" in path.parts:
                  continue

              if not path.is_file():
                  continue

              name = path.as_posix()

              if name in allowed:
                  continue

              current[name] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          if current != initial:
              changed = sorted(
                  name
                  for name in set(initial) | set(current)
                  if initial.get(name) != current.get(name)
              )

              raise SystemExit(
                  "FICHIERS PROTEGES MODIFIES : "
                  + ", ".join(changed)
              )

          raw = subprocess.check_output([
              "git",
              "status",
              "--porcelain=v1",
              "-z",
              "--untracked-files=all"
          ])

          parts = raw.split(b"\0")
          i = 0

          while i < len(parts):
              entry = parts[i]
              i += 1

              if not entry:
                  continue

              status = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8")

              if status not in (" M", "M ", "MM", "??"):
                  raise SystemExit(
                      "Operation Git interdite : " + path
                  )

              if path not in allowed:
                  raise SystemExit(
                      "Fichier Git interdit : " + path
                  )

          print("Protection complete validee")
          print("Fichiers suivis : proteges")
          print("Fichiers non suivis : proteges")
          print("Fichiers ignores : proteges")
          PY

      - name: "Publier uniquement les JSON PMU"
        id: publication
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/collecte_m1_pmu.json \
            data/diagnostic_collecte_m1.json

          python - <<'PY'
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output([
              "git",
              "diff",
              "--cached",
              "--name-status",
              "-z"
          ])

          parts = raw.split(b"\0")
          staged = set()
          i = 0

          while i < len(parts):
              status = parts[i]
              i += 1

              if not status:
                  continue

              if i >= len(parts):
                  raise SystemExit("Index Git incomplet")

              path = parts[i].decode("utf-8")
              i += 1

              if status not in (b"A", b"M"):
                  raise SystemExit(
                      "Operation interdite : " + path
                  )

              staged.add(path)

          if not staged <= allowed:
              raise SystemExit(
                  "Publication hors perimetre M1"
              )

          print("Publication strictement limitee")
          PY

          if git diff --cached --quiet; then
            echo "Aucun changement a publier"
            exit 0
          fi

          git commit -m \
            "M1: collecte PMU France controlee"

          git push origin HEAD:main

      - name: "Rapport final"
        if: always()
        env:
          COLLECTE: ${{ steps.collecte.outcome }}
          FRAICHEUR: ${{ steps.fraicheur.outcome }}
          AUTONOMIE: ${{ steps.autonomie.outcome }}
          ARCHIVES: ${{ steps.archives.outcome }}
          PROTECTION: ${{ steps.protection.outcome }}
          PUBLICATION: ${{ steps.publication.outcome }}
        run: |
          {
            echo "## 🇸🇳🧠🔥 MPAA X1000 - M1"
            echo ""
            echo "- Collecte : ${COLLECTE}"
            echo "- Fraicheur JSON : ${FRAICHEUR}"
            echo "- Autonomie sportive : ${AUTONOMIE}"
            echo "- Archives FIGE : ${ARCHIVES}"
            echo "- Protection fichiers : ${PROTECTION}"
            echo "- Publication : ${PUBLICATION}"
            echo ""
            echo "### Garanties"
            echo ""
            echo "- Collecte toutes les 10 min demandee"
            echo "- Courses France verifiees"
            echo "- Aucun pronostic invente"
            echo "- Aucun FIGE retroactif"
            echo "- Aucun audit invente"
            echo "- Aucun acces a M2-M5"
            echo "- Aucun deploiement PHOENIX"
          } >> "$GITHUB_STEP_SUMMARY"
