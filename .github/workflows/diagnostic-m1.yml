name: "X1000 M1 - Pipeline securise V3.5"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-m1-pipeline-test
  cancel-in-progress: false

jobs:
  validation:
    name: "M1 - Tests et preanalyse isoles"
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/m1-pipeline-securise-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: "Recuperer la branche de test"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les fichiers requis"
        run: |
          set -euo pipefail

          for f in \
            m1.py \
            pmu_engine.py \
            m1_analyse_autonome.py \
            data/courses.json \
            data/collecte_m1_pmu.json
          do
            test -f "$f" || {
              echo "::error::Fichier absent : $f"
              exit 1
            }
          done

          echo "Fichiers M1 presents"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          for nom in (
              "m1.py",
              "pmu_engine.py",
              "m1_analyse_autonome.py"
          ):
              source = Path(nom).read_text(
                  encoding="utf-8-sig"
              )
              ast.parse(source, filename=nom)
              print("Syntaxe OK :", nom)
          PY

      - name: "Verifier les JSON existants"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def paires(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError(
                          "Cle dupliquee : " + key
                      )
                  result[key] = value
              return result

          def constante(value):
              raise ValueError(
                  "Constante interdite : " + value
              )

          def lire(path):
              return json.loads(
                  Path(path).read_text(
                      encoding="utf-8-sig"
                  ),
                  object_pairs_hook=paires,
                  parse_constant=constante
              )

          publication = lire("data/courses.json")

          if isinstance(publication, dict):
              courses = publication.get("courses")
          elif isinstance(publication, list):
              courses = publication
          else:
              raise ValueError(
                  "Structure publication invalide"
              )

          if not isinstance(courses, list):
              raise ValueError(
                  "courses.json : liste attendue"
              )

          collecte = lire(
              "data/collecte_m1_pmu.json"
          )

          if not isinstance(collecte, dict):
              raise ValueError(
                  "Collecte : objet attendu"
              )

          source = collecte.get("courses")

          if not isinstance(source, list):
              raise ValueError(
                  "Collecte : courses invalides"
              )

          print("Publication :", len(courses))
          print("Collecte :", len(source))

          if source and not courses:
              print(
                  "::warning::Collecte presente "
                  "mais publication M1 vide"
              )

          print("Structures JSON valides")
          PY

      - name: "Autotests et archives M1"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1_analyse_autonome.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

          echo "Autotests termines"

      - name: "Creer environnement isole"
        run: |
          set -euo pipefail

          TEST_DIR="$RUNNER_TEMP/x1000-m1-test"

          mkdir -p "$TEST_DIR/data"

          cp pmu_engine.py "$TEST_DIR/"
          cp m1_analyse_autonome.py "$TEST_DIR/"

          test ! -e \
            "$TEST_DIR/data/collecte_m1_pmu.json"

          echo "Environnement isole pret"

      - name: "Collecter PMU dans la copie"
        id: collecte
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000-m1-test"

          python pmu_engine.py

          test -f data/collecte_m1_pmu.json
          test -f data/diagnostic_collecte_m1.json

          echo "Collecte terminee"

      - name: "Verifier collecte PMU complete"
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-m1-test"
              / "data"
          )

          def lire(nom):
              def pairs(items):
                  result = {}
                  for k, v in items:
                      if k in result:
                          raise ValueError(
                              "Cle dupliquee : " + k
                          )
                      result[k] = v
                  return result

              def reject(value):
                  raise ValueError(
                      "Constante interdite : " + value
                  )

              return json.loads(
                  (root / nom).read_text(
                      encoding="utf-8-sig"
                  ),
                  object_pairs_hook=pairs,
                  parse_constant=reject
              )

          collecte = lire("collecte_m1_pmu.json")
          diagnostic = lire(
              "diagnostic_collecte_m1.json"
          )

          if not all(
              isinstance(x, dict)
              for x in (collecte, diagnostic)
          ):
              raise ValueError(
                  "Objet JSON attendu"
              )

          if (
              collecte.get("statut") != "OK"
              or diagnostic.get("statut") != "OK"
          ):
              raise ValueError(
                  "Collecte non validee"
              )

          if (
              collecte.get("erreurs") != []
              or diagnostic.get("erreurs") != []
          ):
              raise ValueError(
                  "Erreurs de collecte presentes"
              )

          if (
              collecte.get("collecte_a")
              != diagnostic.get("collecte_a")
          ):
              raise ValueError(
                  "Horodatages differents"
              )

          if (
              collecte.get("statistiques")
              != diagnostic.get("statistiques")
          ):
              raise ValueError(
                  "Statistiques incoherentes"
              )

          paris = ZoneInfo("Europe/Paris")
          now = dt.datetime.now(paris)

          stamp = dt.datetime.fromisoformat(
              collecte["collecte_a"].replace(
                  "Z", "+00:00"
              )
          )

          if (
              stamp.tzinfo is None
              or stamp.utcoffset() is None
          ):
              raise ValueError(
                  "Fuseau horaire absent"
              )

          age = (
              now - stamp.astimezone(paris)
          ).total_seconds()

          if not 0 <= age <= 1800:
              raise ValueError(
                  "Collecte ancienne ou future"
              )

          today = now.date().isoformat()

          if (
              collecte.get("date") != today
              or diagnostic.get("date") != today
          ):
              raise ValueError(
                  "Date Paris incoherente"
              )

          courses = collecte.get("courses")

          if (
              not isinstance(courses, list)
              or not courses
          ):
              raise ValueError(
                  "Aucune course collectee"
              )

          ids = set()
          total_partants = 0
          total_np = 0

          pattern = (
              r"\d{4}-\d{2}-\d{2}"
              r"-R[1-9]\d*-C[1-9]\d*"
          )

          for course in courses:
              if not isinstance(course, dict):
                  raise ValueError(
                      "Course non structuree"
                  )

              cid = course.get("id")

              if (
                  not isinstance(cid, str)
                  or not re.fullmatch(pattern, cid)
                  or cid in ids
                  or not cid.startswith(today + "-")
              ):
                  raise ValueError(
                      "Identifiant invalide ou double"
                  )

              ids.add(cid)

              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  raise ValueError(
                      "France non verifiee : " + cid
                  )

              depart = dt.datetime.fromisoformat(
                  course["depart"].replace(
                      "Z", "+00:00"
                  )
              )

              if (
                  depart.tzinfo is None
                  or depart.utcoffset() is None
                  or depart.astimezone(
                      paris
                  ).date().isoformat() != today
              ):
                  raise ValueError(
                      "Depart invalide : " + cid
                  )

              chevaux = course.get("partants")

              if (
                  not isinstance(chevaux, list)
                  or not chevaux
              ):
                  raise ValueError(
                      "Partants invalides : " + cid
                  )

              numeros = set()
              np = set()

              for cheval in chevaux:
                  if not isinstance(cheval, dict):
                      raise ValueError(
                          "Cheval non structure"
                      )

                  numero = cheval.get("numero")
                  nom = cheval.get("nom")

                  if (
                      type(numero) is not int
                      or numero <= 0
                      or numero in numeros
                      or not isinstance(nom, str)
                      or not nom.strip()
                  ):
                      raise ValueError(
                          "Cheval invalide : " + cid
                      )

                  numeros.add(numero)

                  statut = cheval.get(
                      "non_partant"
                  )

                  if type(statut) is not bool:
                      raise ValueError(
                          "Statut NP invalide"
                      )

                  if statut:
                      np.add(numero)

              declares = course.get(
                  "non_partants"
              )

              if (
                  not isinstance(declares, list)
                  or any(
                      type(n) is not int
                      for n in declares
                  )
                  or len(declares) != len(set(declares))
                  or set(declares) != np
              ):
                  raise ValueError(
                      "NP incoherents : " + cid
                  )

              actifs = len(numeros) - len(np)

              if (
                  type(
                      course.get("nombre_partants")
                  ) is not int
                  or course["nombre_partants"]
                  != actifs
              ):
                  raise ValueError(
                      "Total partants invalide"
                  )

              total_partants += actifs
              total_np += len(np)

          stats = collecte.get("statistiques")

          if not isinstance(stats, dict):
              raise ValueError(
                  "Statistiques absentes"
              )

          attendus = {
              "courses": len(courses),
              "partants": total_partants,
              "non_partants": total_np
          }

          for cle, valeur in attendus.items():
              if (
                  type(stats.get(cle)) is not int
                  or stats[cle] != valeur
              ):
                  raise ValueError(
                      "Statistique incoherente : "
                      + cle
                  )

          print("Collecte fraiche : OK")
          print("Courses :", len(courses))
          print("Partants :", total_partants)
          print("Non-partants :", total_np)
          print("Age secondes :", round(age))
          PY

      - name: "Preanalyse M1 independante"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000-m1-test"

          python m1_analyse_autonome.py \
            --source data/collecte_m1_pmu.json \
            --output "$RUNNER_TEMP/m1-propositions.json"

      - name: "Verifier rapport de preanalyse"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "m1-propositions.json"
          )

          if not path.is_file():
              raise ValueError(
                  "Rapport M1 absent"
              )

          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(report, dict):
              raise ValueError(
                  "Rapport M1 invalide"
              )

          if (
              report.get("moteur") != "M1"
              or report.get("statut")
              != "PREPUBLICATION"
          ):
              raise ValueError(
                  "Rapport non conforme"
              )

          propositions = report.get(
              "propositions"
          )

          count = report.get(
              "nombre_propositions"
          )

          if (
              not isinstance(propositions, list)
              or type(count) is not int
              or count < 0
              or count != len(propositions)
          ):
              raise ValueError(
                  "Propositions incoherentes"
              )

          if report.get(
              "aucune_modification_figes"
          ) is not True:
              raise ValueError(
                  "Protection FIGE non confirmee"
              )

          print("Propositions M1 :", count)
          print("Preanalyse non officielle")
          print("Aucun FIGE publie")
          PY

      - name: "Verifier integrite du depot"
        if: always()
        run: |
          set -euo pipefail

          if test -n "$(
            git status --porcelain \
              --untracked-files=all
          )"; then
            echo "::error::Depot modifie"
            git status --short
            exit 1
          fi

          echo "Depot intact"

      - name: "Bilan final securise"
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COLLECTE_STATUS: ${{ steps.collecte.outcome }}
        run: |
          echo "================================"
          echo "X1000 M1 - PIPELINE V3.5"
          echo "================================"
          echo "Job : $JOB_STATUS"
          echo "Collecte : $COLLECTE_STATUS"
          echo "Aucun push"
          echo "Aucune publication"
          echo "Aucun FIGE cree"
          echo "Aucun pronostic modifie"
          echo "M2-M5 non touches"
          echo "================================"
