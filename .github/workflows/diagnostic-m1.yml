name: "X1000 M1 - Pipeline securise V3.3"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1000-m1-pipeline-test
  cancel-in-progress: false

jobs:
  validation:
    name: "M1 - Collecte, analyse et controles"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: "Verifier la branche autorisee"
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          test "$EVENT" = "workflow_dispatch"
          test "$BRANCH" = \
            "feature/m1-pipeline-securise-20261031"

          echo "Branche de test autorisee"

      - name: "Recuperer le depot"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les fichiers M1"
        run: |
          set -euo pipefail

          test -f m1.py
          test -f pmu_engine.py
          test -f m1_analyse_autonome.py
          test -f data/courses.json
          test -f data/collecte_m1_pmu.json

          echo "Fichiers requis presents"

      - name: "Verifier la syntaxe Python"
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          fichiers = [
              "m1.py",
              "pmu_engine.py",
              "m1_analyse_autonome.py"
          ]

          for nom in fichiers:
              source = Path(nom).read_text(
                  encoding="utf-8-sig"
              )
              ast.parse(source, filename=nom)
              print("Syntaxe OK :", nom)
          PY

      - name: "Controler les JSON existants"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def paires(items):
              resultat = {}
              for cle, valeur in items:
                  if cle in resultat:
                      raise ValueError(
                          "Cle dupliquee : " + cle
                      )
                  resultat[cle] = valeur
              return resultat

          def constante(valeur):
              raise ValueError(
                  "Constante interdite : " + valeur
              )

          def lire(nom):
              return json.loads(
                  Path(nom).read_text(
                      encoding="utf-8-sig"
                  ),
                  object_pairs_hook=paires,
                  parse_constant=constante
              )

          courses = lire("data/courses.json")

          if isinstance(courses, dict):
              liste = courses.get("courses")
          elif isinstance(courses, list):
              liste = courses
          else:
              raise ValueError(
                  "Structure courses.json invalide"
              )

          if not isinstance(liste, list):
              raise ValueError(
                  "courses : liste attendue"
              )

          collecte = lire(
              "data/collecte_m1_pmu.json"
          )

          if not isinstance(collecte, dict):
              raise ValueError(
                  "Collecte PMU : objet attendu"
              )

          if not isinstance(
              collecte.get("courses"), list
          ):
              raise ValueError(
                  "Collecte PMU : courses invalides"
              )

          print("JSON valides")
          print("Courses publication :", len(liste))
          print(
              "Courses collecte :",
              len(collecte["courses"])
          )
          PY

      - name: "Executer les autotests"
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1_analyse_autonome.py --self-test

      - name: "Preparer une copie isolee"
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/x1000-m1-test"
          mkdir -p "$RUNNER_TEMP/x1000-m1-test/data"

          cp pmu_engine.py \
            "$RUNNER_TEMP/x1000-m1-test/"

          cp m1_analyse_autonome.py \
            "$RUNNER_TEMP/x1000-m1-test/"

          cp data/collecte_m1_pmu.json \
            "$RUNNER_TEMP/x1000-m1-test/data/"

          echo "Copie temporaire preparee"

      - name: "Collecte PMU en isolation"
        id: collecte
        continue-on-error: true
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000-m1-test"

          python pmu_engine.py

      - name: "Verifier la collecte temporaire"
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dossier = (
              Path(os.environ["RUNNER_TEMP"])
              / "x1000-m1-test"
              / "data"
          )

          chemin = dossier / "collecte_m1_pmu.json"

          if not chemin.is_file():
              raise SystemExit(
                  "Collecte temporaire absente"
              )

          contenu = json.loads(
              chemin.read_text(encoding="utf-8")
          )

          if not isinstance(contenu, dict):
              raise SystemExit(
                  "Structure collecte invalide"
              )

          courses = contenu.get("courses")

          if not isinstance(courses, list):
              raise SystemExit(
                  "courses : liste attendue"
              )

          print("Courses disponibles :", len(courses))
          print("Structure temporaire valide")
          PY

      - name: "Preanalyse M1 isolee"
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/x1000-m1-test"

          python m1_analyse_autonome.py \
            --source data/collecte_m1_pmu.json \
            --output "$RUNNER_TEMP/m1-propositions.json"

      - name: "Verifier les propositions M1"
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          chemin = (
              Path(os.environ["RUNNER_TEMP"])
              / "m1-propositions.json"
          )

          rapport = json.loads(
              chemin.read_text(encoding="utf-8")
          )

          if not isinstance(rapport, dict):
              raise ValueError("Rapport M1 invalide")

          nombre = rapport.get(
              "nombre_propositions"
          )

          if type(nombre) is not int or nombre < 0:
              raise ValueError(
                  "Nombre de propositions invalide"
              )

          print("Propositions M1 :", nombre)
          print("Aucune validation officielle")
          print("Aucun FIGE cree")
          PY

      - name: "Verifier les fichiers suivis"
        if: always()
        run: |
          set -euo pipefail

          if test -n "$(git status --porcelain)"; then
            echo "Modification detectee :"
            git status --short
            exit 1
          fi

          echo "Depot suivi intact"

      - name: "Bilan de validation"
        if: always()
        env:
          COLLECTE_RESULT: ${{ steps.collecte.outcome }}
        run: |
          echo "================================"
          echo "X1000 M1 - BILAN SECURISE"
          echo "================================"
          echo "Collecte : $COLLECTE_RESULT"
          echo "Aucun push"
          echo "Aucune publication"
          echo "Aucun FIGE officiel"
          echo "Aucune modification M2-M5"
          echo "================================"
