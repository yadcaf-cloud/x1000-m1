# 🇸🇳🧠🔥 X1000 M1
# VALIDATION SECURISEE UNIFIEE - VERSION 3.1
#
# DEPOT : yadcaf-cloud/x1000-m1
#
# - Branche securisee uniquement
# - Tests sans modification du depot
# - Collecte PMU dans une copie temporaire
# - Importation M1 isolee
# - Verification JSON et FIGE
# - Controle SHA256 des fichiers suivis
# - Aucun push ni deploiement
# - Aucun pronostic ou FIGE genere
# - Aucun acces aux moteurs M2-M5
#
# L'analyse sportive autonome reste distincte.

name: "X1000 M1 - Validation securisee unifiee"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/m1-autonomie-securisee-20261031"
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - "index.html"
      - "data/**"
      - ".github/workflows/m1-validation-branche.yml"

permissions:
  contents: read

concurrency:
  group: m1-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "M1 - Diagnostic protege"
    if: github.ref == 'refs/heads/feature/m1-autonomie-securisee-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier les fichiers
        run: |
          set -euo pipefail

          for file in m1.py pmu_engine.py index.html; do
            test -f "$file"
            test ! -L "$file"
            echo "OK: $file"
          done

          test -d data
          test ! -L data

      - name: Enregistrer integrite initiale
        run: |
          set -euo pipefail

          test -z "$(git status --porcelain --untracked-files=all)"

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          def snapshot():
              result = {}

              def walk(folder):
                  with os.scandir(folder) as entries:
                      for entry in entries:
                          path = Path(entry.path)
                          name = path.as_posix()

                          if path.parts[0] == ".git":
                              continue

                          mode = entry.stat(
                              follow_symlinks=False
                          ).st_mode

                          if stat.S_ISDIR(mode):
                              result[name] = "DIR"
                              walk(path)

                          elif stat.S_ISLNK(mode):
                              result[name] = (
                                  "LINK:" + os.readlink(path)
                              )

                          elif stat.S_ISREG(mode):
                              digest = hashlib.sha256(
                                  path.read_bytes()
                              ).hexdigest()

                              result[name] = "FILE:" + digest

                          else:
                              result[name] = "SPECIAL"

              walk(Path("."))
              return result

          Path("/tmp/m1-before.json").write_text(
              json.dumps(snapshot(), sort_keys=True),
              encoding="utf-8"
          )

          print("Empreintes SHA256 enregistrees")
          PY

      - name: Verifier syntaxe Python
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print("SYNTAXE OK:", name)
          PY

      - name: Verifier les JSON existants
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def pairs(items):
              result = {}

              for key, value in items:
                  if key in result:
                      raise ValueError(
                          "Cle JSON dupliquee: " + key
                      )
                  result[key] = value

              return result

          def constant(value):
              raise ValueError(
                  "Constante JSON interdite: " + value
              )

          paths = sorted(Path("data").rglob("*.json"))

          for path in paths:
              if path.is_symlink():
                  raise SystemExit(
                      "Lien symbolique interdit"
                  )

              with path.open(encoding="utf-8") as f:
                  json.load(
                      f,
                      object_pairs_hook=pairs,
                      parse_constant=constant
                  )

              print("JSON OK:", path)

          print("Total controles:", len(paths))
          PY

      - name: Tester les moteurs
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

      - name: Preparer copie temporaire
        id: preparation
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          echo "path=$WORKDIR" >> "$GITHUB_OUTPUT"

          cp m1.py pmu_engine.py "$WORKDIR/"

          mkdir -p "$WORKDIR/data"
          cp -a data/. "$WORKDIR/data/"

          rm -f \
            "$WORKDIR/data/collecte_m1_pmu.json" \
            "$WORKDIR/data/diagnostic_collecte_m1.json" \
            "$WORKDIR/data/import_diagnostic.json"

          echo "Copie temporaire prete"

      - name: Collecter les courses PMU
        id: collecte
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -uo pipefail

          python pmu_engine.py
          code=$?

          if [ "$code" -eq 0 ]; then
            echo "etat=complete" >> "$GITHUB_OUTPUT"

          elif [ "$code" -eq 2 ]; then
            echo "etat=partielle" >> "$GITHUB_OUTPUT"
            echo "::warning::Collecte partielle"

          else
            python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/diagnostic_collecte_m1.json")
          statut = ""

          if p.is_file():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  statut = d.get("statut", "")
              except (ValueError, OSError):
                  pass

          if statut == "AUCUNE_COURSE_VERIFIEE":
              print("Aucune course verifiee")
          else:
              raise SystemExit("Collecte PMU en echec")
          PY

            if [ "$?" -eq 0 ]; then
              echo "etat=aucune_course" >> "$GITHUB_OUTPUT"
            else
              echo "etat=echec" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

      - name: Controler la collecte recue
        id: controle
        if: steps.collecte.outputs.etat == 'complete' || steps.collecte.outputs.etat == 'partielle'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          paris = ZoneInfo("Europe/Paris")

          def lire(name):
              path = Path("data") / name
              return json.loads(
                  path.read_text(encoding="utf-8")
              )

          data = lire("collecte_m1_pmu.json")
          diag = lire("diagnostic_collecte_m1.json")

          if not isinstance(data, dict):
              raise SystemExit("Collecte invalide")

          if not isinstance(diag, dict):
              raise SystemExit("Diagnostic invalide")

          if data.get("statut") not in ("OK", "PARTIEL"):
              raise SystemExit("Statut invalide")

          if data.get("statut") != diag.get("statut"):
              raise SystemExit("Statuts contradictoires")

          if data.get("date") != diag.get("date"):
              raise SystemExit("Dates contradictoires")

          if data.get("collecte_a") != diag.get("collecte_a"):
              raise SystemExit("Horodatages contradictoires")

          courses = data.get("courses")

          if not isinstance(courses, list):
              raise SystemExit("Courses absentes")

          stamp = dt.datetime.fromisoformat(
              data["collecte_a"].replace("Z", "+00:00")
          )

          if stamp.tzinfo is None:
              raise SystemExit("Fuseau absent")

          now = dt.datetime.now(paris)
          moment = stamp.astimezone(paris)

          age = (now - moment).total_seconds()

          if age < -300 or age > 1200:
              raise SystemExit("Collecte non recente")

          if data.get("date") != moment.date().isoformat():
              raise SystemExit("Date incoherente")

          pattern = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          ids = set()

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("Course invalide")

              cid = course.get("id")

              if not isinstance(cid, str):
                  raise SystemExit("ID absent")

              if not pattern.fullmatch(cid):
                  raise SystemExit("ID invalide: " + cid)

              if cid in ids:
                  raise SystemExit("Doublon: " + cid)

              ids.add(cid)

          print("Courses:", len(courses))
          print("Age secondes:", round(age))
          print("Statut:", data["statut"])
          PY

      - name: Tester importation isolee
        id: importation
        if: steps.controle.outcome == 'success'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python m1.py \
            --import-json data/collecte_m1_pmu.json

          python m1.py --verify-archives

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/import_diagnostic.json")

          if not path.is_file():
              raise SystemExit("Diagnostic import absent")

          report = json.loads(
              path.read_text(encoding="utf-8")
          )

          imported = report.get("importees")
          rejected = report.get("rejetees")

          if type(imported) is not int or imported < 0:
              raise SystemExit("Compteur invalide")

          if not isinstance(rejected, list):
              raise SystemExit("Rejets invalides")

          print("Importees:", imported)
          print("Rejetees:", len(rejected))

          for item in rejected:
              print("REJET:", item)
          PY

      - name: Verifier integrite finale
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          path = Path("/tmp/m1-before.json")

          if not path.is_file():
              raise SystemExit(
                  "Empreintes initiales absentes"
              )

          before = json.loads(
              path.read_text(encoding="utf-8")
          )

          after = {}

          def walk(folder):
              with os.scandir(folder) as entries:
                  for entry in entries:
                      path = Path(entry.path)
                      name = path.as_posix()

                      if path.parts[0] == ".git":
                          continue

                      mode = entry.stat(
                          follow_symlinks=False
                      ).st_mode

                      if stat.S_ISDIR(mode):
                          after[name] = "DIR"
                          walk(path)

                      elif stat.S_ISLNK(mode):
                          after[name] = (
                              "LINK:" + os.readlink(path)
                          )

                      elif stat.S_ISREG(mode):
                          after[name] = (
                              "FILE:" +
                              hashlib.sha256(
                                  path.read_bytes()
                              ).hexdigest()
                          )

                      else:
                          after[name] = "SPECIAL"

          walk(Path("."))

          if before != after:
              added = sorted(after.keys() - before.keys())
              removed = sorted(before.keys() - after.keys())

              changed = sorted(
                  key
                  for key in before.keys() & after.keys()
                  if before[key] != after[key]
              )

              print("Ajoutes:", added)
              print("Supprimes:", removed)
              print("Modifies:", changed)

              raise SystemExit("Integrite violee")

          print("SHA256 OK")
          PY

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            exit 1
          fi

          echo "DEPOT INCHANGE"

      - name: Rapport final
        if: always()
        env:
          RESULTAT: ${{ job.status }}
          COLLECTE: ${{ steps.collecte.outputs.etat }}
          CONTROLE: ${{ steps.controle.outcome }}
          IMPORT: ${{ steps.importation.outcome }}
        run: |
          {
            echo "## X1000 M1 - Validation 3.1"
            echo ""
            echo "- Branche: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Resultat: $RESULTAT"
            echo "- Collecte: ${COLLECTE:-non executee}"
            echo "- Controle: ${CONTROLE:-non execute}"
            echo "- Importation: ${IMPORT:-non executee}"
            echo "- Git: lecture seule"
            echo "- Aucun push"
            echo "- Aucune publication"
            echo "- Aucun pronostic genere"
            echo "- Aucun FIGE publie"
            echo "- Archives verifiees"
            echo "- Analyse sportive non activee"
            echo "- Aucun deploiement PHOENIX"
          } >> "$GITHUB_STEP_SUMMARY"
