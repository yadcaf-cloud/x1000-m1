# 🇸🇳🧠🔥 X1000 M1
# VALIDATION SECURISEE UNIFIEE - VERSION 3.3
#
# Depot : yadcaf-cloud/x1000-m1
# Branche : feature/m1-autonomie-securisee-20261031
#
# Correction : courses.json : liste attendue
# Conversion uniquement dans la copie temporaire.
#
# PROTECTIONS
# - Depot original en lecture seule
# - Aucun push ni deploiement
# - Aucune modification du tableau officiel
# - Aucune decision sportive automatique
# - Aucun pronostic ou FIGE cree
# - Archives FIGE conservees et controlees
# - Collecte PMU reelle, France verifiee
# - Aucune donnee hippique inventee
# - Aucun acces aux moteurs M2 a M5
# - Controle SHA256 initial et final

name: "X1000 M1 - Validation securisee unifiee 3.3"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/m1-autonomie-securisee-20261031"
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - "index.html"
      - "data/**"
      - ".github/workflows/m1-validation-branche.yml"

permissions:
  contents: read

concurrency:
  group: m1-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "M1 - Validation et importation isolees"
    if: github.ref == 'refs/heads/feature/m1-autonomie-securisee-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: Recuperer la branche securisee
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier la structure initiale
        run: |
          set -euo pipefail

          for file in m1.py pmu_engine.py index.html; do
            test -f "$file"
            test ! -L "$file"
          done

          test -d data
          test ! -L data

          test -z "$(git status --porcelain --untracked-files=all)"

          echo "Structure initiale OK"

      - name: Enregistrer empreintes SHA256
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          def snapshot():
              result = {}

              def walk(folder):
                  with os.scandir(folder) as entries:
                      for entry in entries:
                          p = Path(entry.path)

                          if p.parts[0] == ".git":
                              continue

                          key = p.as_posix()
                          mode = entry.stat(
                              follow_symlinks=False
                          ).st_mode

                          if stat.S_ISDIR(mode):
                              result[key] = "DIR"
                              walk(p)

                          elif stat.S_ISLNK(mode):
                              result[key] = (
                                  "LINK:" + os.readlink(p)
                              )

                          elif stat.S_ISREG(mode):
                              sha = hashlib.sha256(
                                  p.read_bytes()
                              ).hexdigest()
                              result[key] = "FILE:" + sha

                          else:
                              result[key] = "SPECIAL"

              walk(Path("."))
              return result

          Path("/tmp/m1-initial.json").write_text(
              json.dumps(snapshot(), sort_keys=True),
              encoding="utf-8"
          )

          print("SHA256 initial enregistre")
          PY

      - name: Verifier Python et JSON stricts
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print("Python OK:", name)

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError(
                          "Cle JSON dupliquee: " + key
                      )
                  result[key] = value
              return result

          def constant(value):
              raise ValueError(
                  "Constante JSON interdite: " + value
              )

          for path in sorted(Path("data").rglob("*.json")):
              if path.is_symlink():
                  raise ValueError(
                      "Lien symbolique interdit: " + str(path)
                  )

              with path.open(encoding="utf-8") as stream:
                  json.load(
                      stream,
                      object_pairs_hook=pairs,
                      parse_constant=constant
                  )

              print("JSON OK:", path)
          PY

      - name: Creer copie temporaire isolee
        id: preparation
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          echo "path=$WORKDIR" >> "$GITHUB_OUTPUT"

          cp m1.py pmu_engine.py "$WORKDIR/"
          cp -a data "$WORKDIR/data"

          # Eviter toute reutilisation d'une ancienne collecte.
          rm -f \
            "$WORKDIR/data/collecte_m1_pmu.json" \
            "$WORKDIR/data/diagnostic_collecte_m1.json" \
            "$WORKDIR/data/import_diagnostic.json"

          echo "Copie temporaire creee"
          echo "Depot original intact"

      - name: Corriger courses.json dans la copie
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path
          import m1

          path = Path("data/courses.json")

          if path.is_symlink():
              raise SystemExit(
                  "Lien symbolique courses.json interdit"
              )

          if not path.exists():
              path.write_text(
                  "[]\n",
                  encoding="utf-8"
              )
              print("Base M1 absente : liste vide initialisee")
              raise SystemExit(0)

          data = m1.load_json(
              path.read_text(encoding="utf-8")
          )

          if isinstance(data, list):
              courses = data
              print("Format liste deja compatible")

          elif isinstance(data, dict):
              courses = data.get("courses")

              if not isinstance(courses, list):
                  raise SystemExit(
                      "courses.json : courses[] invalide"
                  )

              print(
                  "Conversion objet vers liste dans la copie"
              )

          else:
              raise SystemExit(
                  "courses.json : format incompatible"
              )

          ids = set()
          normalized = []

          for raw in courses:
              try:
                  course = m1.normalize_course(raw)
              except (ValueError, TypeError, KeyError) as exc:
                  raise SystemExit(
                      "Course existante invalide: " + str(exc)
                  )

              cid = course["id"]

              if cid in ids:
                  raise SystemExit(
                      "Course existante dupliquee: " + cid
                  )

              ids.add(cid)
              normalized.append(course)

          # Ecriture autorisee dans la copie uniquement.
          path.write_text(
              json.dumps(
                  normalized,
                  ensure_ascii=False,
                  indent=2,
                  allow_nan=False
              ) + "\n",
              encoding="utf-8"
          )

          print("Base M1 compatible")
          print("Courses conservees:", len(normalized))
          PY

      - name: Tester M1 et collecteur PMU
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

          echo "Tests M1 et PMU OK"

      - name: Collecter les courses PMU reelles
        id: collecte
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -uo pipefail

          python pmu_engine.py
          code=$?

          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            if python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/diagnostic_collecte_m1.json")

          if not path.is_file():
              raise SystemExit(1)

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except (ValueError, OSError):
              raise SystemExit(1)

          if (
              not isinstance(data, dict)
              or data.get("statut")
              != "AUCUNE_COURSE_VERIFIEE"
          ):
              raise SystemExit(1)
          PY
            then
              echo "etat=aucune_course" >> "$GITHUB_OUTPUT"
              echo "::notice::Aucune course francaise verifiee"
              exit 0
            fi

            echo "::error::Echec collecte PMU"
            exit 1
          fi

          if [ "$code" -eq 2 ]; then
            echo "etat=partielle" >> "$GITHUB_OUTPUT"
            echo "::warning::Collecte PMU partielle"
          else
            echo "etat=complete" >> "$GITHUB_OUTPUT"
          fi

      - name: Controler fraicheur et coherence
        id: controle
        if: steps.collecte.outputs.etat == 'complete' || steps.collecte.outputs.etat == 'partielle'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def lire(name):
              return json.loads(
                  (Path("data") / name).read_text(
                      encoding="utf-8"
                  )
              )

          data = lire("collecte_m1_pmu.json")
          diag = lire("diagnostic_collecte_m1.json")

          if not isinstance(data, dict):
              raise SystemExit("Collecte invalide")

          if not isinstance(diag, dict):
              raise SystemExit("Diagnostic invalide")

          for field in ("date", "collecte_a", "statut"):
              if data.get(field) != diag.get(field):
                  raise SystemExit(
                      "Incoherence collecte: " + field
                  )

          if data.get("statut") not in ("OK", "PARTIEL"):
              raise SystemExit("Statut collecte inexploitable")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit("Aucune course exploitable")

          stamp = dt.datetime.fromisoformat(
              data["collecte_a"].replace("Z", "+00:00")
          )

          if (
              stamp.tzinfo is None
              or stamp.utcoffset() is None
          ):
              raise SystemExit("Horodatage sans fuseau")

          age = (
              dt.datetime.now(dt.timezone.utc)
              - stamp.astimezone(dt.timezone.utc)
          ).total_seconds()

          if not -300 <= age <= 1200:
              raise SystemExit(
                  "Collecte trop ancienne ou future"
              )

          paris = ZoneInfo("Europe/Paris")

          if data.get("date") != (
              stamp.astimezone(paris).date().isoformat()
          ):
              raise SystemExit("Date de collecte incoherente")

          pattern = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          ids = set()

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("Course invalide")

              cid = course.get("id")

              if (
                  not isinstance(cid, str)
                  or not pattern.fullmatch(cid)
              ):
                  raise SystemExit("Identifiant course invalide")

              if cid in ids:
                  raise SystemExit(
                      "Course dupliquee: " + cid
                  )

              ids.add(cid)

              if course.get(
                  "localisation_france_verifiee"
              ) is not True:
                  raise SystemExit(
                      "Localisation France non verifiee"
                  )

              depart = dt.datetime.fromisoformat(
                  course["depart"].replace("Z", "+00:00")
              )

              if (
                  depart.tzinfo is None
                  or depart.utcoffset() is None
              ):
                  raise SystemExit(
                      "Depart sans fuseau"
                  )

              if (
                  depart.astimezone(paris).date().isoformat()
                  != cid[:10]
              ):
                  raise SystemExit(
                      "Date de course incoherente"
                  )

          print("Fraicheur OK")
          print("Age collecte:", round(age), "secondes")
          print("Courses verifiees:", len(courses))
          PY

      - name: Importer M1 dans la copie uniquement
        id: importation
        if: steps.controle.outcome == 'success'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python m1.py \
            --import-json data/collecte_m1_pmu.json

          python m1.py --verify-archives

          python - <<'PY'
          import json
          from pathlib import Path
          import m1

          path = Path("data/import_diagnostic.json")

          if not path.is_file():
              raise SystemExit(
                  "Diagnostic import absent"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "Diagnostic import invalide"
              )

          imported = data.get("importees")
          rejected = data.get("rejetees")

          if (
              type(imported) is not int
              or imported < 0
              or not isinstance(rejected, list)
          ):
              raise SystemExit(
                  "Compteurs import invalides"
              )

          courses = m1.records("courses.json")
          ids = [c["id"] for c in courses]

          if len(ids) != len(set(ids)):
              raise SystemExit(
                  "Doublons dans la base M1"
              )

          if data.get("total_courses") != len(courses):
              raise SystemExit(
                  "Total courses incoherent"
              )

          print("Importees:", imported)
          print("Rejetees:", len(rejected))
          print("Total base M1:", len(courses))

          for item in rejected:
              print("Rejet:", json.dumps(
                  item, ensure_ascii=False
              ))

          if imported == 0:
              print(
                  "::warning::Aucune course importee"
              )
          PY

      - name: Verifier archives FIGE apres importation
        if: steps.importation.outcome == 'success'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python m1.py --verify-archives

          echo "Archives FIGE controlees"
          echo "Aucun FIGE cree par le workflow"

      - name: Verifier integrite finale du depot
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          path = Path("/tmp/m1-initial.json")

          if not path.is_file():
              raise SystemExit(
                  "Empreintes initiales absentes"
              )

          before = json.loads(
              path.read_text(encoding="utf-8")
          )

          after = {}

          def walk(folder):
              with os.scandir(folder) as entries:
                  for entry in entries:
                      p = Path(entry.path)

                      if p.parts[0] == ".git":
                          continue

                      key = p.as_posix()
                      mode = entry.stat(
                          follow_symlinks=False
                      ).st_mode

                      if stat.S_ISDIR(mode):
                          after[key] = "DIR"
                          walk(p)

                      elif stat.S_ISLNK(mode):
                          after[key] = (
                              "LINK:" + os.readlink(p)
                          )

                      elif stat.S_ISREG(mode):
                          sha = hashlib.sha256(
                              p.read_bytes()
                          ).hexdigest()
                          after[key] = "FILE:" + sha

                      else:
                          after[key] = "SPECIAL"

          walk(Path("."))

          if before != after:
              added = sorted(
                  after.keys() - before.keys()
              )

              removed = sorted(
                  before.keys() - after.keys()
              )

              changed = sorted(
                  key
                  for key in before.keys() & after.keys()
                  if before[key] != after[key]
              )

              print("Ajoutes:", added)
              print("Supprimes:", removed)
              print("Modifies:", changed)

              raise SystemExit(
                  "Integrite SHA256 violee"
              )

          print("Integrite SHA256 OK")
          PY

          test -z "$(git status --porcelain --untracked-files=all)"

          echo "Depot original intact"

      - name: Rapport final de validation
        if: always()
        env:
          RESULTAT: ${{ job.status }}
          COLLECTE: ${{ steps.collecte.outputs.etat }}
          CONTROLE: ${{ steps.controle.outcome }}
          IMPORT: ${{ steps.importation.outcome }}
        run: |
          {
            echo "## 🇸🇳🧠🔥 X1000 M1 - Validation 3.3"
            echo ""
            echo "- Branche: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Resultat: $RESULTAT"
            echo "- Collecte: ${COLLECTE:-non executee}"
            echo "- Controle: ${CONTROLE:-non execute}"
            echo "- Importation: ${IMPORT:-non executee}"
            echo "- Correction courses.json: copie uniquement"
            echo "- Depot original: lecture seule"
            echo "- Publication: aucune"
            echo "- Pronostics automatiques: aucun"
            echo "- FIGEs crees: aucun"
            echo "- Analyse sportive autonome: desactivee"
            echo "- Moteurs M2-M5: non concernes"
          } >> "$GITHUB_STEP_SUMMARY"
