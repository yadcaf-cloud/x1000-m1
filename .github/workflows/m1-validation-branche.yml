# 🇸🇳🧠🔥 X1000 M1
# VALIDATION SECURISEE UNIFIEE - VERSION 3.2
#
# Depot : yadcaf-cloud/x1000-m1
# Branche : feature/m1-autonomie-securisee-20261031
#
# - Tests sans publication
# - Collecte PMU reelle dans une copie isolee
# - Importation M1 dans la copie uniquement
# - Verification des JSON et des archives FIGE
# - Protection SHA256 avant et apres les tests
# - Aucun push, pronostic, FIGE ou deploiement
# - Aucune intervention sur M2, M3, M4, M5

name: "X1000 M1 - Validation securisee unifiee"

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/m1-autonomie-securisee-20261031"
    paths:
      - "m1.py"
      - "pmu_engine.py"
      - "index.html"
      - "data/**"
      - ".github/workflows/m1-validation-branche.yml"

permissions:
  contents: read

concurrency:
  group: m1-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: "M1 - Tests et importation isoles"
    if: github.ref == 'refs/heads/feature/m1-autonomie-securisee-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      M1_AUTO_ANALYZE: "false"

    steps:
      - name: Recuperer la branche
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier structure et integrite initiale
        run: |
          set -euo pipefail

          for file in m1.py pmu_engine.py index.html; do
            test -f "$file"
            test ! -L "$file"
          done

          test -d data
          test ! -L data

          test -z "$(git status --porcelain --untracked-files=all)"

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          def snapshot():
              result = {}

              def walk(folder):
                  with os.scandir(folder) as entries:
                      for entry in entries:
                          p = Path(entry.path)

                          if p.parts[0] == ".git":
                              continue

                          key = p.as_posix()
                          mode = entry.stat(
                              follow_symlinks=False
                          ).st_mode

                          if stat.S_ISDIR(mode):
                              result[key] = "DIR"
                              walk(p)

                          elif stat.S_ISLNK(mode):
                              result[key] = (
                                  "LINK:" + os.readlink(p)
                              )

                          elif stat.S_ISREG(mode):
                              digest = hashlib.sha256(
                                  p.read_bytes()
                              ).hexdigest()
                              result[key] = "FILE:" + digest

                          else:
                              result[key] = "SPECIAL"

              walk(Path("."))
              return result

          Path("/tmp/m1-initial.json").write_text(
              json.dumps(snapshot(), sort_keys=True),
              encoding="utf-8"
          )

          print("Empreintes initiales enregistrees")
          PY

      - name: Valider syntaxe et JSON sans ecriture
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("m1.py", "pmu_engine.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print("Syntaxe OK:", name)

          def pairs(items):
              result = {}

              for key, value in items:
                  if key in result:
                      raise ValueError(
                          "Cle JSON dupliquee: " + key
                      )
                  result[key] = value

              return result

          def constant(value):
              raise ValueError(
                  "Constante JSON interdite: " + value
              )

          for path in sorted(
              Path("data").rglob("*.json")
          ):
              if path.is_symlink():
                  raise ValueError(
                      "Lien symbolique interdit: " + str(path)
                  )

              with path.open(encoding="utf-8") as f:
                  json.load(
                      f,
                      object_pairs_hook=pairs,
                      parse_constant=constant
                  )

              print("JSON OK:", path)
          PY

      - name: Creer une copie isolee
        id: preparation
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          echo "path=$WORKDIR" >> "$GITHUB_OUTPUT"

          cp m1.py pmu_engine.py "$WORKDIR/"
          cp -a data "$WORKDIR/data"

          rm -f \
            "$WORKDIR/data/collecte_m1_pmu.json" \
            "$WORKDIR/data/diagnostic_collecte_m1.json" \
            "$WORKDIR/data/import_diagnostic.json"

          echo "Copie temporaire prete"

      - name: Tester moteurs et archives
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python pmu_engine.py --self-test
          python m1.py --self-test
          python m1.py --verify-archives

      - name: Collecter les courses PMU
        id: collecte
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -uo pipefail

          python pmu_engine.py
          code=$?

          if [ "$code" -eq 0 ]; then
            echo "etat=complete" >> "$GITHUB_OUTPUT"

          elif [ "$code" -eq 2 ]; then
            echo "etat=partielle" >> "$GITHUB_OUTPUT"
            echo "::warning::Collecte PMU partielle"

          else
            if python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/diagnostic_collecte_m1.json"
          )

          if not path.is_file():
              raise SystemExit(1)

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except (ValueError, OSError):
              raise SystemExit(1)

          if (
              not isinstance(data, dict)
              or data.get("statut")
              != "AUCUNE_COURSE_VERIFIEE"
          ):
              raise SystemExit(1)
          PY
            then
              echo "etat=aucune_course" >> "$GITHUB_OUTPUT"
              echo "::notice::Aucune course verifiee"
            else
              echo "etat=echec" >> "$GITHUB_OUTPUT"
              echo "::error::Echec collecte PMU"
              exit 1
            fi
          fi

      - name: Verifier fraicheur et coherence
        id: controle
        if: steps.collecte.outputs.etat == 'complete' || steps.collecte.outputs.etat == 'partielle'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def lire(name):
              path = Path("data") / name
              return json.loads(
                  path.read_text(encoding="utf-8")
              )

          data = lire("collecte_m1_pmu.json")
          diag = lire("diagnostic_collecte_m1.json")

          if not isinstance(data, dict):
              raise SystemExit("Collecte invalide")

          if not isinstance(diag, dict):
              raise SystemExit("Diagnostic invalide")

          for field in ("date", "collecte_a", "statut"):
              if data.get(field) != diag.get(field):
                  raise SystemExit(
                      "Incoherence: " + field
                  )

          if data.get("statut") not in ("OK", "PARTIEL"):
              raise SystemExit("Statut inexploitable")

          courses = data.get("courses")

          if not isinstance(courses, list) or not courses:
              raise SystemExit(
                  "Aucune course a importer"
              )

          stamp = dt.datetime.fromisoformat(
              data["collecte_a"].replace("Z", "+00:00")
          )

          if (
              stamp.tzinfo is None
              or stamp.utcoffset() is None
          ):
              raise SystemExit(
                  "Horodatage sans fuseau"
              )

          paris = ZoneInfo("Europe/Paris")

          age = (
              dt.datetime.now(dt.timezone.utc)
              - stamp.astimezone(dt.timezone.utc)
          ).total_seconds()

          if not -300 <= age <= 1200:
              raise SystemExit(
                  "Collecte non recente"
              )

          if data.get("date") != (
              stamp.astimezone(paris).date().isoformat()
          ):
              raise SystemExit(
                  "Date incoherente"
              )

          pattern = re.compile(
              r"^\d{4}-\d{2}-\d{2}-R[1-9]\d*-C[1-9]\d*$"
          )

          ids = set()

          for course in courses:
              if not isinstance(course, dict):
                  raise SystemExit("Course invalide")

              cid = course.get("id")

              if not isinstance(cid, str):
                  raise SystemExit("ID absent")

              if not pattern.fullmatch(cid):
                  raise SystemExit(
                      "Identifiant invalide: " + cid
                  )

              if cid in ids:
                  raise SystemExit(
                      "Course dupliquee: " + cid
                  )

              ids.add(cid)

          print("Courses controlees:", len(courses))
          print("Age collecte:", round(age), "secondes")
          PY

      - name: Importer uniquement dans la copie
        id: importation
        if: steps.controle.outcome == 'success'
        working-directory: ${{ steps.preparation.outputs.path }}
        run: |
          set -euo pipefail

          python m1.py \
            --import-json data/collecte_m1_pmu.json

          python m1.py --verify-archives

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/import_diagnostic.json")

          if not path.is_file():
              raise SystemExit(
                  "Diagnostic import absent"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "Diagnostic import invalide"
              )

          imported = data.get("importees")
          rejected = data.get("rejetees")

          if (
              type(imported) is not int
              or imported < 0
              or not isinstance(rejected, list)
          ):
              raise SystemExit(
                  "Compteurs import invalides"
              )

          print("Importees:", imported)
          print("Rejetees:", len(rejected))
          PY

      - name: Verifier integrite finale
        if: always()
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          path = Path("/tmp/m1-initial.json")

          if not path.is_file():
              raise SystemExit(
                  "Empreintes initiales absentes"
              )

          before = json.loads(
              path.read_text(encoding="utf-8")
          )

          after = {}

          def walk(folder):
              with os.scandir(folder) as entries:
                  for entry in entries:
                      p = Path(entry.path)

                      if p.parts[0] == ".git":
                          continue

                      key = p.as_posix()
                      mode = entry.stat(
                          follow_symlinks=False
                      ).st_mode

                      if stat.S_ISDIR(mode):
                          after[key] = "DIR"
                          walk(p)

                      elif stat.S_ISLNK(mode):
                          after[key] = (
                              "LINK:" + os.readlink(p)
                          )

                      elif stat.S_ISREG(mode):
                          digest = hashlib.sha256(
                              p.read_bytes()
                          ).hexdigest()
                          after[key] = "FILE:" + digest

                      else:
                          after[key] = "SPECIAL"

          walk(Path("."))

          if before != after:
              added = sorted(
                  after.keys() - before.keys()
              )

              removed = sorted(
                  before.keys() - after.keys()
              )

              changed = sorted(
                  key
                  for key in before.keys() & after.keys()
                  if before[key] != after[key]
              )

              print("Ajoutes:", added)
              print("Supprimes:", removed)
              print("Modifies:", changed)

              raise SystemExit(
                  "Integrite SHA256 violee"
              )

          print("Integrite SHA256 OK")
          PY

          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Depot intact"

      - name: Rapport final
        if: always()
        env:
          RESULTAT: ${{ job.status }}
          COLLECTE: ${{ steps.collecte.outputs.etat }}
          CONTROLE: ${{ steps.controle.outcome }}
          IMPORT: ${{ steps.importation.outcome }}
        run: |
          {
            echo "## X1000 M1 - Validation 3.2"
            echo ""
            echo "- Branche: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Resultat: $RESULTAT"
            echo "- Collecte: ${COLLECTE:-non executee}"
            echo "- Controle: ${CONTROLE:-non execute}"
            echo "- Importation: ${IMPORT:-non executee}"
            echo "- Publication: aucune"
            echo "- Pronostics/FIGEs: aucune creation demandee"
            echo "- Analyse sportive autonome: non activee"
            echo "- Depot: lecture seule"
          } >> "$GITHUB_STEP_SUMMARY"
