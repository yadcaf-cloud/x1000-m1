name: "X1000 M1 - Collecte PMU reelle"

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-pmu
  cancel-in-progress: false

jobs:
  collecte-pmu:
    name: "Collecte PMU France"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Paris

    steps:
      - name: "Recuperer depot M1"
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier collecteur PMU"
        run: |
          test -f pmu_engine.py
          python -m py_compile pmu_engine.py
          python pmu_engine.py --self-test

      - name: "Collecter les courses PMU"
        id: collecte
        continue-on-error: true
        run: |
          python pmu_engine.py

      - name: "Verifier les fichiers produits"
        id: verification
        if: steps.collecte.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("data")

          fichiers = [
              "collecte_m1_pmu.json",
              "diagnostic_collecte_m1.json"
          ]

          for nom in fichiers:
              chemin = base / nom
              if not chemin.is_file():
                  raise SystemExit(
                      "Fichier absent : " + str(chemin)
                  )
              with chemin.open(
                  encoding="utf-8"
              ) as f:
                  donnees = json.load(f)

              if not isinstance(donnees, dict):
                  raise SystemExit(
                      "Format JSON incorrect : " + nom
                  )

          with (
              base / "collecte_m1_pmu.json"
          ).open(encoding="utf-8") as f:
              collecte = json.load(f)

          if collecte.get("statut") != "OK":
              raise SystemExit(
                  "Collecte non valide"
              )

          if not collecte.get("courses"):
              raise SystemExit(
                  "Aucune course verifiee"
              )

          for course in collecte["courses"]:
              if (
                  course.get(
                      "localisation_france_verifiee"
                  ) is not True
              ):
                  raise SystemExit(
                      "Course non francaise verifiee"
                  )

          print("Collecte PMU validee")
          PY

      - name: "Publier uniquement les JSON PMU"
        if: >-
          steps.collecte.outcome == 'success' &&
          steps.verification.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/collecte_m1_pmu.json \
            data/diagnostic_collecte_m1.json

          if git diff --cached --quiet; then
            echo "Aucune modification PMU"
            exit 0
          fi

          git diff --cached --name-only

          git commit -m \
            "M1: actualisation collecte PMU"

          git push origin HEAD:main

      - name: "Bilan collecte"
        if: always()
        run: |
          {
            echo "## X1000 M1 - Collecte PMU"
            echo ""
            echo "- Collecte : ${{ steps.collecte.outcome }}"
            echo "- Verification : ${{ steps.verification.outcome }}"
            echo "- Frequence demandee : 10 minutes"
            echo "- Donnees M1 protegees : non modifiees"
            echo "- FIGES historiques : non modifies"
            echo "- Pronostics : non modifies"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Signaler une collecte non valide"
        if: >-
          steps.collecte.outcome != 'success' ||
          steps.verification.outcome != 'success'
        run: |
          echo "Collecte PMU non validee"
          exit 1
