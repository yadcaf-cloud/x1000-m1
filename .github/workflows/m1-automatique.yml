# 🇸🇳🧠🔥 X1000 M1
# Automatisation sécurisée — collecte et publication
# Aucun pronostic ni FIGÉ créé ou modifié.

name: "X1000 M1 - Automatisation securisee"

on:
  workflow_dispatch:

  schedule:
    # Toutes les 10 minutes (UTC)
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: x1000-m1-collecte-publication
  cancel-in-progress: false

jobs:
  collecte-m1:
    name: "Collecte PMU et publication M1"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Paris
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: "Recuperer le depot M1"
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: "Installer Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Verifier les fichiers requis"
        run: |
          set -euo pipefail
          test -f pmu_engine.py
          test -f m1.py
          test -f index.html

      - name: "Verifier la syntaxe Python"
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("pmu_engine.py", "m1.py"):
              compile(
                  Path(name).read_bytes(),
                  name,
                  "exec"
              )
              print(name, "syntaxe OK")
          PY

      - name: "Tester le collecteur PMU"
        run: python pmu_engine.py --self-test

      - name: "Tester le moteur M1"
        run: python m1.py --self-test

      - name: "Verifier les FIGEs existants"
        run: python m1.py --verify-archives

      - name: "Verifier l'etat initial du depot"
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

      - name: "Collecter les donnees PMU reelles"
        run: python pmu_engine.py

      - name: "Controler la collecte"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          base = Path("data")
          source = base / "collecte_m1_pmu.json"
          diag = base / "diagnostic_collecte_m1.json"

          assert source.is_file()
          assert diag.is_file()

          data = json.loads(
              source.read_text(encoding="utf-8")
          )
          report = json.loads(
              diag.read_text(encoding="utf-8")
          )

          assert data["statut"] == "OK"
          assert report["statut"] == "OK"
          assert not data.get("erreurs")
          assert isinstance(data.get("courses"), list)
          assert data["courses"]

          today = datetime.now(
              ZoneInfo("Europe/Paris")
          ).date().isoformat()

          assert data["date"] == today
          assert report["date"] == today

          ids = set()

          for course in data["courses"]:
              cid = course["id"]
              assert cid not in ids
              ids.add(cid)

              assert course[
                  "localisation_france_verifiee"
              ] is True

              assert course["partants"]
              assert course["depart"]

              nums = set()
              for horse in course["partants"]:
                  number = horse["numero"]
                  assert number not in nums
                  nums.add(number)
                  assert horse["nom"]

          print("Collecte verifiee")
          print("Courses :", len(ids))
          print("Aucune decision M1 creee")
          print("Aucun FIGE cree")
          PY

      - name: "Verifier les fichiers modifies"
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "data/collecte_m1_pmu.json",
              "data/diagnostic_collecte_m1.json"
          }

          raw = subprocess.check_output(
              ["git", "status", "--porcelain", "-z"]
          )

          entries = raw.split(b"\0")
          paths = set()
          i = 0

          while i < len(entries):
              entry = entries[i]
              i += 1
              if not entry:
                  continue

              status = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8")

              if "R" in status or "C" in status:
                  raise SystemExit(
                      "Renommage/copie non autorise"
                  )

              paths.add(path)

          unexpected = paths - allowed

          if unexpected:
              raise SystemExit(
                  "Modification interdite : " +
                  ", ".join(sorted(unexpected))
              )

          print("Fichiers modifies autorises")
          PY

      - name: "Publier uniquement les JSON de collecte"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            data/collecte_m1_pmu.json \
            data/diagnostic_collecte_m1.json

          if git diff --cached --quiet; then
            echo "Aucune modification a publier"
            exit 0
          fi

          git commit -m \
            "M1: actualisation collecte PMU reelle"

          # Refuser toute divergence plutot
          # que reecrire l'historique.
          git push origin HEAD:main

      - name: "Publier le diagnostic GitHub Actions"
        if: always()
        run: |
          {
            echo "## X1000 M1"
            echo ""
            echo "- Collecte : voir les etapes"
            echo "- Publication : JSON de collecte uniquement"
            echo "- Pronostics : non modifies"
            echo "- FIGEs : non modifies"
            echo "- Audits : non modifies"
            echo "- Tableau officiel : non modifie"
            echo "- M2 a M5 : non modifies"
          } >> "$GITHUB_STEP_SUMMARY"
